<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14262E">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>AP Plastic Factory ERP</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Myanmar:wght@400;600&display=swap">
<style>
/* Layout: left department rail + work area; tables run full width and behave like the factory's ledger sheets. */
:root{
  --bg:#EEF1F3; --surface:#FFFFFF; --sunk:#F6F8F9; --ink:#15202A; --muted:#5B6975; --line:#D5DCE2;
  --accent:#0B6E78; --accent-ink:#FFFFFF; --accent-soft:#DDEFF0;
  --paper:#F6C945; --paper-soft:#FDF3D2; --paper-ink:#5A4300;
  --good:#1E7B4A; --good-soft:#DDF1E5; --warn:#A46200; --warn-soft:#FBEBCF; --bad:#B4322A; --bad-soft:#F8DEDB;
  --rail:#14262E; --rail-ink:#C9D6DB; --rail-active:#F6C945;
  --s1:#0B6E78; --s2:#D9822B; --s3:#5B5FC7; --s4:#C2416B; --s5:#3F8F3A; --s6:#8A6D3B;
  --f-display:"Archivo","Noto Sans Myanmar",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Noto Sans Myanmar",system-ui,sans-serif;
  --f-data:"IBM Plex Mono","Noto Sans Myanmar",ui-monospace,monospace;
  --f-my:"Noto Sans Myanmar","Padauk",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1519; --surface:#152027; --sunk:#111A20; --ink:#E4ECEF; --muted:#93A4AE; --line:#26343C;
  --accent:#4FBFC8; --accent-ink:#06282B; --accent-soft:#16363B;
  --paper:#E9BC3A; --paper-soft:#2E2812; --paper-ink:#F3D88A;
  --good:#5CC98C; --good-soft:#143224; --warn:#E5A84A; --warn-soft:#33260F; --bad:#EF7A70; --bad-soft:#3A1916;
  --rail:#0A1115; --rail-ink:#A9B9C0; --rail-active:#E9BC3A;
  --s1:#4FBFC8; --s2:#F0A55A; --s3:#8E92F0; --s4:#EC7FA0; --s5:#79C26F; --s6:#C9A770; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1519; --surface:#152027; --sunk:#111A20; --ink:#E4ECEF; --muted:#93A4AE; --line:#26343C;
  --accent:#4FBFC8; --accent-ink:#06282B; --accent-soft:#16363B;
  --paper:#E9BC3A; --paper-soft:#2E2812; --paper-ink:#F3D88A;
  --good:#5CC98C; --good-soft:#143224; --warn:#E5A84A; --warn-soft:#33260F; --bad:#EF7A70; --bad-soft:#3A1916;
  --rail:#0A1115; --rail-ink:#A9B9C0; --rail-active:#E9BC3A;
  --s1:#4FBFC8; --s2:#F0A55A; --s3:#8E92F0; --s4:#EC7FA0; --s5:#79C26F; --s6:#C9A770; color-scheme:dark}
html,body{height:100%}
/* trends */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:3px 10px;font-size:12px;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.chipbtn[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.chipbtn i{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:5px 11px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button:focus-visible{outline:2px solid var(--accent)}
svg.chart .ln{fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
/* colour lab */
.lab{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px;align-items:start}
.wheelbox{position:relative;width:240px;height:240px;margin:0 auto;touch-action:none}
.wheelbox canvas{width:240px;height:240px;border-radius:50%;cursor:crosshair;display:block}
.marker{position:absolute;width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.6),0 1px 4px rgba(0,0,0,.4);transform:translate(-50%,-50%);pointer-events:none}
.tgt{height:56px;border-radius:8px;border:1px solid var(--line)}
.pair{display:grid;grid-template-columns:1fr 1fr;border-radius:8px;overflow:hidden;border:1px solid var(--line);height:72px}
.pair div{display:flex;align-items:flex-end;padding:6px 8px;font-size:11px;font-weight:600}
.pair .lt{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.sugs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.sug{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.sug .ratio{font:600 14px var(--f-data)}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid rgba(0,0,0,.2);vertical-align:-2px}
.swbtn{cursor:pointer;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 8px;font-size:12px}
.colorin{width:44px;height:28px;padding:0;border:1px solid var(--line);border-radius:4px;background:none}
.photo canvas{max-width:100%;border-radius:6px;cursor:crosshair;display:block}
@media (max-width:900px){.lab{grid-template-columns:minmax(0,1fr)}}
/* language, keyboard */
[hidden]{display:none!important}
.topr{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.langseg button{display:inline-flex;align-items:center;gap:6px}
.langseg svg{border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.15);flex:none}
.iconbtn{display:inline-flex;align-items:center;gap:6px}
.iconbtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7}
.iconbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
:lang(my) body,html[lang="my"] body{font-family:var(--f-my)}
html[lang="my"] .tabs button,html[lang="my"] .nav button{line-height:1.8}
.osk{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--sunk);border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(0,0,0,.12);padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:5px;user-select:none;-webkit-user-select:none}
.osk-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;max-width:860px;width:100%;margin:0 auto}
.osk-row{display:flex;gap:4px;max-width:860px;width:100%;margin:0 auto}
.key{flex:1 1 0;min-width:0;height:42px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:500 17px var(--f-my);cursor:pointer;padding:0;touch-action:manipulation}
.key:active,.key.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.key.wide{flex:1.6 1 0;font:500 13px var(--f-body)}
.key.space{flex:5 1 0;font:500 13px var(--f-body)}
.key small{display:block;font-size:10px;color:var(--muted);line-height:1}
body.kb-open main{padding-bottom:320px}
@media (max-width:520px){.key{height:38px;font-size:15px}.iconbtn span{display:none}}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100%}
.rail{background:var(--rail);color:var(--rail-ink);padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;flex-direction:column;gap:2px}
.brand b{font:800 22px/1 var(--f-display);color:#fff;letter-spacing:.01em}
:root[data-theme="light"] .brand b{color:#fff}
.brand span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--rail-ink);opacity:.8}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;color:var(--rail-ink);font-weight:500}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button[aria-current="true"]{background:rgba(255,255,255,.08);color:#fff;box-shadow:inset 3px 0 0 var(--rail-active)}
.nav button:focus-visible{outline:2px solid var(--rail-active)}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7}
.nav .count{margin-left:auto;font:500 11px var(--f-data);background:var(--bad);color:#fff;border-radius:9px;padding:0 6px}
.rail .foot{margin-top:auto;font-size:12px;opacity:.75;display:flex;flex-direction:column;gap:4px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-right:6px}
.dot.on{background:#3FCF86}
main{min-width:0;padding-block:20px 48px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px;justify-content:space-between}
.top h1{margin:0;font:700 26px/1.15 var(--f-display);text-wrap:balance}
.top .sub{color:var(--muted);font-size:13px}
.month{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px}
.month button{all:unset;cursor:pointer;padding:4px 9px;border-radius:5px;color:var(--muted)}
.month button:hover{background:var(--sunk);color:var(--ink)}
.month input{border:0;background:transparent;font:500 14px var(--f-data);width:132px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs button{all:unset;cursor:pointer;padding:8px 12px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent)}
.banner{border-radius:8px;padding:10px 14px;font-size:13px;display:flex;gap:10px;align-items:flex-start;background:var(--paper-soft);color:var(--paper-ink);border:1px solid color-mix(in srgb,var(--paper) 50%,transparent)}
.banner.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font:600 22px/1.2 var(--f-data);font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0;display:flex;flex-direction:column}
.panel>h3{margin:0;padding:12px 14px 0;font:700 15px var(--f-display)}
.panel>.pb{padding:12px 14px 14px;min-width:0}
.panel .hint{color:var(--muted);font-size:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.bar .left,.bar .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.danger.arm{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.search{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 10px;min-width:0;width:220px;max-width:100%}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--sunk);position:sticky;top:0}
td.n,th.n{text-align:right;font-family:var(--f-data);font-size:13px}
td.my{font-family:var(--f-my)}
tbody tr:hover{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
tr.click{cursor:pointer}
tfoot td{font-weight:600;background:var(--sunk);border-bottom:0}
.sheet td{padding:3px 6px}
.sheet td.n,.sheet td.my,.sheet td.t{padding:7px 10px}
.cell{width:100%;min-width:72px;border:1px solid transparent;background:var(--paper-soft);border-radius:4px;padding:5px 8px;text-align:right;font:500 13px var(--f-data);color:var(--ink)}
.cell:hover{border-color:var(--line)}
.cell:focus{background:var(--surface);border-color:var(--accent);outline:none}
.cell.txt{text-align:left;font-family:var(--f-body)}
.cell:disabled{background:transparent}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:10px;letter-spacing:.02em}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.mute{background:var(--sunk);color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:12px}
.alerts{display:flex;flex-direction:column}
.alert{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.alert:last-child{border-bottom:0}
.alert .sev{flex:none;width:4px;align-self:stretch;border-radius:2px;background:var(--warn)}
.alert .sev.bad{background:var(--bad)} .alert .sev.info{background:var(--accent)}
.alert .go{margin-left:auto;flex:none}
.empty{padding:28px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--ink);font:700 15px var(--f-display)}
svg.chart text{fill:var(--muted);font:11px var(--f-data)}
svg.chart .grid{stroke:var(--line)}
svg.chart .b{fill:var(--accent)} svg.chart .b.hi{fill:var(--paper)}
svg.chart .lbl{fill:var(--ink);font-weight:500}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,18,22,.45);z-index:20;display:flex;justify-content:flex-end}
.drawer{background:var(--surface);width:min(520px,100%);height:100%;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.2);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.drawer header h2{margin:0;font:700 18px var(--f-display);flex:1}
.drawer .body{overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px;flex:1}
.drawer footer{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);justify-content:space-between}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--sunk);border-radius:6px;padding:7px 9px;width:100%}
.field textarea{min-height:70px;resize:vertical}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.lines{display:flex;flex-direction:column;gap:6px}
.lines .ln{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) auto;gap:6px;align-items:center}
.lines select,.lines input{border:1px solid var(--line);background:var(--sunk);border-radius:6px;padding:6px 8px;width:100%;min-width:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:6px;z-index:30;font-weight:500}
.sum{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted)}
.sum b{color:var(--ink);font-family:var(--f-data);font-weight:500}
.paperhead{font-family:var(--f-my)}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;flex-direction:column;gap:10px;padding-block:12px;padding-right:max(16px,env(safe-area-inset-right,0px))}
  .nav{flex-direction:row;overflow-x:auto;gap:4px}
  .nav button{white-space:nowrap;padding:7px 9px}
  .nav button[aria-current="true"]{box-shadow:inset 0 -3px 0 var(--rail-active)}
  .rail .foot{display:none}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .grid2{grid-template-columns:minmax(0,1fr)}
}
.login{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.loginbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px;width:min(380px,100%);display:flex;flex-direction:column;gap:14px}
.loginbox .brand b{color:var(--ink);font:800 26px var(--f-display)}.loginbox .brand span{color:var(--muted)}
.field input[type=email],.field input[type=password]{border:1px solid var(--line);background:var(--sunk);border-radius:6px;padding:9px 10px;width:100%}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>


</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand"><b>AP Plastic</b><span>Factory ERP</span></div>
    <nav class="nav" id="nav" aria-label="Departments"></nav>
    <div class="foot"><div><span class="dot" id="syncDot"></span><span id="syncTxt">Connecting…</span></div><div id="whoTxt" class="notr"></div><button class="btn sm" id="signOut" hidden style="align-self:flex-start;margin-top:4px">Sign out</button></div>
  </aside>
  <main id="main">
    <div class="top">
      <div><h1 id="pageTitle">Overview</h1><div class="sub" id="pageSub"></div></div>
      <div class="topr">
        <div class="seg langseg" role="group" aria-label="Language" id="langSeg"></div>
        <button class="btn iconbtn" id="cmtBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg><span>Suggest a change</span></button>
        <button class="btn iconbtn" id="kbBtn" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6 10h1M9 10h1M12 10h1M15 10h1M18 10h0M7 14h10"/></svg><span>Keyboard</span></button>
        <div class="month" aria-label="Month">
          <button id="mPrev" aria-label="Previous month">◀</button>
          <input type="month" id="monthIn">
          <button id="mNext" aria-label="Next month">▶</button>
        </div>
      </div>
    </div>
    <div id="bannerArea"></div>
    <div id="tabsArea"></div>
    <div id="view" style="display:flex;flex-direction:column;gap:16px;min-width:0"></div>
  </main>
</div>
<div id="login" class="login" hidden><form id="loginForm" class="loginbox" novalidate>
  <div class="brand"><b>AP Plastic</b><span>Factory ERP</span></div>
  <div id="lgIntro" class="small muted" hidden></div>
  <div class="field"><label for="lgEmail">Username</label><input id="lgEmail" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
  <div class="field"><label for="lgPass">Password</label><input id="lgPass" type="password" autocomplete="current-password" required></div>
  <div class="field" id="lgPass2Box" hidden><label for="lgPass2">Type the password again</label><input id="lgPass2" type="password" autocomplete="new-password"></div>
  <div id="lgMsg" class="small" style="color:var(--bad);min-height:1.2em"></div>
  <button class="btn primary" id="lgBtn" type="submit">Sign in</button>
  <div class="seg langseg" role="group" aria-label="Language" id="lgLang"></div>
</form></div>
<div id="drawerRoot"></div>
<div id="toastRoot"></div>
<div id="osk" class="osk" hidden role="group" aria-label="Keyboard"></div>

gain": "စကားဝှက် ထပ်ရိုက်ပါ", "Users": "အသုံးပြုသူများ", "Access": "ခွင့်ပြုချက်", "New username": "အသုံးပြုသူအမည်အသစ်", "Add user": "အသုံးပြုသူ ထည့်မည်", "Viewer (look only)": "ကြည့်ရှုသူ (ကြည့်ရုံသာ)", "Editor (can enter records)": "ပြင်ဆင်သူ (မှတ်တမ်း ထည့်နိုင်)", "Remove access": "ခွင့်ပြုချက် ဖယ်မည်", "Loading…": "ဖွင့်နေသည်…", "Viewers can see everything but change nothing. Editors can enter and change records but not Settings. Give the person their username and password yourself.": "ကြည့်ရှုသူများ အားလုံးကြည့်နိုင်သော်လည်း ပြင်၍မရပါ။ ပြင်ဆင်သူများ မှတ်တမ်း ထည့်/ပြင်နိုင်သော်လည်း ဆက်တင် မပြင်နိုင်ပါ။ အသုံးပြုသူအမည်နှင့် စကားဝှက်ကို ကိုယ်တိုင် ပေးပါ။", "Create owner account": "ပိုင်ရှင်အကောင့် ဖန်တီးမည်"}</script>

<script>
"use strict";
/* ---------------- state ---------------- */
const COLS=["suggestions","settings","products","materials","recipes","stock","staff","payroll","production","power","machines","maint","customers","sales"];
const S={}; COLS.forEach(c=>S[c]={});
const loaded=new Set();
let db=null, dbState="connecting", canWrite=true, canSystem=true;
const sysDis=()=>canWrite&&canSystem?"":"disabled";
const DEFAULT_SETTINGS={gPerLb:453.59,gPerViss:1600,bigBagExtra:800,cleanDays:30,workDays:26,includePieceLabour:true,
  staffMode:"fixed",staffPc:16.933,elecMode:"fixed",elecPc:21,maintPc:20,deliveryPc:10,deprPc:0,wastePct:0,riskPct:3,profitPct:10,
  levels:[{id:"L1",name:"Level 1",salary:260000,dayRate:10000,hourRate:1250,otRate:1875},{id:"L2",name:"Level 2",salary:286000,dayRate:11000,hourRate:1375,otRate:2063},{id:"L3",name:"Level 3",salary:312000,dayRate:12000,hourRate:1500,otRate:2250}]};
const set_=()=>Object.assign({},DEFAULT_SETTINGS,S.settings.main||{});
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
const UI={page:ls("ap.page")||"overview",tab:{},month:null,q:""};
try{UI.tab=JSON.parse(ls("ap.tabs")||"{}")}catch(e){}

/* ---------------- helpers ---------------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{const n=parseFloat(String(v??"").replace(/[၀-၉]/g,d=>d.charCodeAt(0)-0x1040).replace(/,/g,""));return isFinite(n)?n:0};
function fmt(n,d=0){if(n===null||n===undefined||!isFinite(n))return "—";return Number(n).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d})}
const ks=n=>fmt(n)+" Ks";
const today=()=>new Date().toISOString().slice(0,10);
const ym=d=>String(d||"").slice(0,7);
function addMonth(m,k){let [y,mo]=m.split("-").map(Number);mo+=k;while(mo<1){mo+=12;y--}while(mo>12){mo-=12;y++}return y+"-"+String(mo).padStart(2,"0")}
const MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const mlabel=m=>{if(!m)return"";const [y,mo]=m.split("-");return MN[+mo-1]+" "+y};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const list=c=>Object.entries(S[c]).map(([id,v])=>Object.assign({id},v));
const products=()=>list("products").sort((a,b)=>(a.no||999)-(b.no||999));
const pname=p=>p?(p.my?p.my+" · ":"")+(p.en||p.id):"—";
function toast(t){const r=$("#toastRoot");r.innerHTML=`<div class="toast">${esc(t)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>r.innerHTML="",2200)}

/* ---------------- persistence ---------------- */
const queues={};
function save(col,id,data,msg){
  S[col][id]=data; scheduleRender();
  if(!db){toast("Not saved: not connected to the database");return Promise.resolve()}
  if(!canWrite){toast("You can view only");return Promise.resolve()}
  if(col==="settings"&&!canSystem){toast("Only the owner can change settings");return Promise.resolve()}
  const key=col+"/"+id;
  queues[key]=(queues[key]||Promise.resolve()).then(()=>db.collection(col).doc(id).set(JSON.parse(JSON.stringify(data)))).then(()=>{if(msg)toast(msg)}).catch(e=>{
    if(/row-level security|permission|policy/i.test((e&&e.message)||"")){toast("You are not allowed to change this");return}
    toast(e&&e.code==="quota_exceeded"?"Storage is full. Delete old records to save new ones.":"Could not save. "+((e&&e.message)||""));
  });
  return queues[key];
}
function remove(col,id,msg){
  delete S[col][id]; scheduleRender();
  if(!db||!canWrite)return;
  db.collection(col).doc(id).delete().then(()=>msg&&toast(msg)).catch(()=>toast("Could not delete"));
}
const debouncers={};
function saveSoon(col,id,data){S[col][id]=data;clearTimeout(debouncers[col+id]);debouncers[col+id]=setTimeout(()=>save(col,id,S[col][id]),500)}

/* ---------------- calculations ---------------- */
function gPerUnit(m){const st=set_();if(!m)return 0;if(m.unit==="lb")return st.gPerLb;if(m.unit==="g")return 1;if(m.unit==="viss")return st.gPerViss;if(m.unit==="kg")return 1000;return num(m.gPerUnit)}
function lineGrams(l){const st=set_();const q=num(l.qty);if(l.unit==="lb")return q*st.gPerLb;if(l.unit==="g")return q;if(l.unit==="viss")return q*st.gPerViss;if(l.unit==="kg")return q*1000;
  if(String(l.mat).startsWith("r:"))return q; const m=S.materials[l.mat];return q*gPerUnit(m)}
function recipeCost(rid,depth=0){
  const r=S.recipes[rid]; if(!r||depth>4)return null;
  let g=0,c=0,ok=true;
  for(const l of (r.lines||[])){
    const grams=lineGrams(l); g+=grams;
    if(String(l.mat).startsWith("r:")){const sub=recipeCost(l.mat.slice(2),depth+1);if(!sub){ok=false;continue}c+=grams*sub.perG}
    else{const m=S.materials[l.mat];if(!m){ok=false;continue}const gpu=gPerUnit(m);if(!gpu||!num(m.price)){ok=false;continue}c+=grams/gpu*num(m.price)}
  }
  return {grams:g,cost:c,perG:g?c/g:0,ok};
}
function matPerG(m){const g=gPerUnit(m);return g?num(m.price)/g:null}
function prodDoc(m){return S.production[m]||{bags:{}}}
function monthDozens(m){const d=prodDoc(m);let t=0;for(const p of products()){t+=num(d.bags?.[p.id])*num(p.dzPerBag)}return t}
function monthBags(m){const d=prodDoc(m);return Object.values(d.bags||{}).reduce((a,b)=>a+num(b),0)}
function payRow(r){const fixed=num(r.fixed);const ot=num(r.otH)*num(r.otRate);const ded=num(r.absent)*num(r.dayRate);return {ot,ded,net:num(r.salary)+fixed+ot+num(r.duty)+num(r.other)-ded}}
function payrollTotal(m){const d=S.payroll[m];if(!d)return null;return Object.values(d.rows||{}).reduce((a,r)=>a+payRow(r).net,0)}
function powerTotal(m){const d=S.power[m];if(!d)return null;return num(d.elec)+num(d.water)}
function monthsWithData(){const s=new Set([...Object.keys(S.production),...Object.keys(S.payroll),...Object.keys(S.power)]);return [...s].filter(x=>/^\d{4}-\d{2}$/.test(x)).sort()}
function overhead(m){
  // per-piece staff wages and power for month m; falls back to average of months that have both values
  const calc=x=>{const pcs=monthDozens(x)*12;if(!pcs)return null;const pay=payrollTotal(x),pw=powerTotal(x);return {pay:pay==null?null:pay/pcs,pw:pw==null?null:pw/pcs}};
  const here=calc(m)||{};
  const months=monthsWithData().map(calc).filter(Boolean);
  const avg=k=>{const v=months.map(o=>o[k]).filter(v=>v!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null};
  return {pay:here.pay??avg("pay"),pw:here.pw??avg("pw"),payAvg:here.pay==null,pwAvg:here.pw==null};
}
function productCost(p,m){
  const st=set_();
  const rb=p.bodyRecipe?recipeCost(p.bodyRecipe):null, rl=p.lidRecipe?recipeCost(p.lidRecipe):null;
  const matB=num(p.bodyG)&&rb&&rb.ok?num(p.bodyG)*rb.perG:(num(p.bodyG)?null:0);
  const matL=num(p.lidG)&&rl&&rl.ok?num(p.lidG)*rl.perG:(num(p.lidG)?null:0);
  const poly=S.materials[p.polyMat]; const big=S.materials[p.bigBagMat];
  const polyPc=poly&&num(p.pcsPerPoly)?num(poly.price)/num(p.pcsPerPoly):0;
  const bigPc=big&&num(p.dzPerBag)?(num(big.price)+num(st.bigBagExtra))/(num(p.dzPerBag)*12):0;
  const oh=overhead(m);
  const pieceLab=st.includePieceLabour?num(p.pieceLabour):0;
  const staff=st.staffMode==="auto"?(oh.pay??0):num(st.staffPc);
  const power=st.elecMode==="auto"?(oh.pw??0):num(st.elecPc);
  const missing=matB===null||matL===null;
  const mat=missing?null:matB+matL;
  const waste=mat==null?0:mat*num(st.wastePct)/100;
  const parts={matB,matL,mat,waste,pieceLab,staff,poly:polyPc,big:bigPc,pack:polyPc+bigPc,power,maint:num(st.maintPc),deliv:num(st.deliveryPc),depr:num(st.deprPc)};
  const base=missing?null:mat+waste+pieceLab+staff+polyPc+bigPc+power+parts.maint+parts.deliv+parts.depr;
  const risk=base==null?null:base*num(st.riskPct)/100;
  const pc=base==null?null:base+risk;
  const dz=pc==null?null:pc*12;
  return Object.assign(parts,{base,risk,pc,dz,target:dz==null?null:dz*(1+num(st.profitPct)/100),missing,oh});
}
function stockBalances(){
  const bal={};const moves=list("stock").sort((a,b)=>(a.date||"").localeCompare(b.date||"")||(a.t||0)-(b.t||0));
  for(const mv of moves){const k=mv.mat;if(!(k in bal))bal[k]=0;const q=num(mv.qty);if(mv.kind==="in")bal[k]+=q;else if(mv.kind==="out")bal[k]-=q;else if(mv.kind==="count")bal[k]=q}
  return bal;
}
function expectedUse(m){
  // grams of each raw material implied by the month's production sheet and each product's mix
  const use={};const d=prodDoc(m);
  const add=(rid,grams,depth=0)=>{const r=S.recipes[rid];if(!r||depth>4)return;const tot=(r.lines||[]).reduce((a,l)=>a+lineGrams(l),0);if(!tot)return;
    for(const l of r.lines||[]){const share=grams*lineGrams(l)/tot;if(String(l.mat).startsWith("r:"))add(l.mat.slice(2),share,depth+1);else use[l.mat]=(use[l.mat]||0)+share}};
  for(const p of products()){const pcs=num(d.bags?.[p.id])*num(p.dzPerBag)*12;if(!pcs)continue;
    if(p.bodyRecipe)add(p.bodyRecipe,pcs*num(p.bodyG));if(p.lidRecipe)add(p.lidRecipe,pcs*num(p.lidG))}
  return use;
}
function lastClean(pid){const e=list("maint").filter(x=>x.target==="p:"+pid&&x.type==="Clean").sort((a,b)=>(b.date||"").localeCompare(a.date||""));return e[0]?.date||null}
function daysSince(d){return d?Math.floor((Date.now()-new Date(d+"T00:00:00").getTime())/864e5):null}
function finishedStock(){
  const st={};for(const p of products())st[p.id]=num(p.openingDz);
  for(const [m,d] of Object.entries(S.production)){for(const [pid,b] of Object.entries(d.bags||{})){const p=S.products[pid];if(p)st[pid]=(st[pid]||0)+num(b)*num(p.dzPerBag)}}
  for(const s of list("sales")){for(const l of s.lines||[]){st[l.p]=(st[l.p]||0)-num(l.dz)}}
  return st;
}
const saleTotal=s=>(s.lines||[]).reduce((a,l)=>a+num(l.dz)*num(l.price),0)+num(s.delivery);

/* ---------------- alerts ---------------- */
function alerts(){
  const m=UI.month,out=[];
  const ready=loaded.has("products");
  if(!ready)return out;
  if(!S.production[m]||!monthBags(m))out.push({sev:"warn",dept:"product",t:`No production entered for ${mlabel(m)}.`,go:["product","sheet"]});
  if(!S.payroll[m])out.push({sev:"warn",dept:"hr",t:`Payroll sheet for ${mlabel(m)} not started.`,go:["hr","payroll"]});
  if(!S.power[m]||!num(S.power[m].elec))out.push({sev:"warn",dept:"power",t:`Electricity bill for ${mlabel(m)} not entered.`,go:["power","bills"]});
  const pk=num(prodDoc(m).packedDz),dz=monthDozens(m);
  if(pk&&dz&&Math.abs(pk-dz)/dz>0.05)out.push({sev:"bad",dept:"product",t:`${mlabel(m)}: packed by female labour ${fmt(pk,1)} dz but production sheet says ${fmt(dz,1)} dz (gap ${fmt(Math.abs(pk-dz),1)} dz).`,go:["hr","labour"]});
  const prev=addMonth(m,-1),pw=powerTotal(m),pwp=powerTotal(prev),dzp=monthDozens(prev);
  if(pw&&pwp&&dz&&dzp){const a=pw/dz,b=pwp/dzp;if(a>b*1.2)out.push({sev:"warn",dept:"power",t:`Electricity per dozen rose ${fmt((a/b-1)*100)}% from ${mlabel(prev)} (${fmt(b,1)} → ${fmt(a,1)} Ks/dz).`,go:["power","bills"]})}
  const bal=stockBalances();
  for(const mt of list("materials")){if(num(mt.minStock)&&(bal[mt.id]??0)<num(mt.minStock))out.push({sev:"bad",dept:"raw",t:`${mt.name} is low: ${fmt(bal[mt.id]??0,1)} ${mt.unit} left (minimum ${fmt(mt.minStock)}).`,go:["raw","stock"]})}
  const cd=num(set_().cleanDays)||30;let due=0;
  for(const p of products()){if(p.active===false)continue;if(!num(p.cavB)&&!num(p.cycB))continue;const ds=daysSince(lastClean(p.id));if(ds!=null&&ds>cd)due++}
  if(due)out.push({sev:"warn",dept:"mold",t:`${due} mold${due>1?"s are":" is"} past the ${cd}-day cleaning interval.`,go:["mold","molds"]});
  const noRec=products().filter(p=>p.active!==false&&num(p.bodyG)&&!p.bodyRecipe);
  if(noRec.length)out.push({sev:"info",dept:"product",t:`${noRec.length} product${noRec.length>1?"s have":" has"} no body mix set, so cost cannot be worked out: ${noRec.map(p=>p.en).join(", ")}.`,go:["product","list"]});
  const noW=products().filter(p=>p.active!==false&&!num(p.bodyG));
  if(noW.length)out.push({sev:"info",dept:"product",t:`Piece weight missing for ${noW.map(p=>p.en).join(", ")}.`,go:["product","list"]});
  const unpaid=list("sales").filter(s=>saleTotal(s)-num(s.paid)>0.5);
  if(unpaid.length)out.push({sev:"warn",dept:"retail",t:`${unpaid.length} sale${unpaid.length>1?"s":""} not fully paid (${ks(unpaid.reduce((a,s)=>a+saleTotal(s)-num(s.paid),0))} owed).`,go:["retail","sales"]});
  return out;
}

function svgBars(data,{h=180,fmtV=v=>fmt(v),hiLast=true,unit=""}={}){
  if(!data.length)return "";
  const W=Math.max(320,data.length*64),pl=46,pr=8,pt=18,pb=26,iw=W-pl-pr,ih=h-pt-pb;
  const max=Math.max(...data.map(d=>d.v||0))||1;const step=niceStep(max/4);const top=Math.ceil(max/step)*step;
  const bw=Math.min(40,iw/data.length*0.6);let g="";
  for(let v=0;v<=top+1e-9;v+=step){const y=pt+ih-ih*v/top;g+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${fmtShort(v)}</text>`}
  data.forEach((d,i)=>{const cx=pl+iw*(i+.5)/data.length;const bh=ih*(d.v||0)/top;const y=pt+ih-bh;
    g+=`<rect class="b ${hiLast&&i===data.length-1?"hi":""}" x="${cx-bw/2}" y="${y}" width="${bw}" height="${Math.max(bh,0)}" rx="2"><title>${esc(d.l)}: ${fmtV(d.v)}${unit}</title></rect>`;
    g+=`<text x="${cx}" y="${h-8}" text-anchor="middle">${esc(d.l)}</text>`;
    if(d.v)g+=`<text class="lbl" x="${cx}" y="${y-5}" text-anchor="middle">${fmtShort(d.v)}</text>`});

}
function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x||1)));const f=x/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}

function editRecipe(id){
  const r=id?JSON.parse(JSON.stringify(S.recipes[id])):{lines:[{mat:"",qty:"",unit:"lb"}]};
  let lines=r.lines||[];
  const opts=()=>[["","— choose —"]].concat(matOpts(false)).concat(list("recipes").filter(x=>x.id!==id).map(x=>["r:"+x.id,"Mix: "+x.name]));
  const linesHTML=()=>`<div class="field"><label>Ingredients</label><div class="lines" id="lns">${lines.map((l,i)=>`<div class="ln"><div>${sel(opts(),l.mat,`data-i="${i}" data-k="mat" aria-label="Ingredient ${i+1}"`)}</div><input data-i="${i}" data-k="qty" inputmode="decimal" value="${esc(l.qty)}" placeholder="Qty" aria-label="Quantity"><div>${sel([["lb","lb"],["g","g"],["viss","viss"],["kg","kg"],["unit","its unit"]],l.unit,`data-i="${i}" data-k="unit" aria-label="Unit"`)}</div><button class="btn sm" data-rm="${i}" aria-label="Remove line">✕</button></div>`).join("")}</div><button class="btn sm" id="addLn" style="margin-top:6px;align-self:flex-start">Add ingredient</button></div>`;

      box.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{lines.splice(+b.dataset.rm,1);rebind()});

function svgLines(labels,series,{h=230,dec=0}={}){
  const W=Math.max(380,labels.length*78),pl=54,pr=18,pt=16,pb=28,iw=W-pl-pr,ih=h-pt-pb;
  const max=Math.max(1,...series.flatMap(s=>s.vals.map(v=>v||0)));const step=niceStep(max/4);const top=Math.ceil(max/step)*step;
  const x=i=>pl+(labels.length<2?iw/2:iw*i/(labels.length-1)),y=v=>pt+ih-ih*(v||0)/top;
  let g="";for(let v=0;v<=top+1e-9;v+=step)g+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${fmtShort(v)}</text>`;
  labels.forEach((l,i)=>g+=`<text x="${x(i)}" y="${h-8}" text-anchor="middle">${esc(l)}</text>`);
  for(const s of series){const d=s.vals.map((v,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
    g+=`<path class="ln" d="${d}" style="stroke:${s.color}"/>`;
    s.vals.forEach((v,i)=>{const last=i===s.vals.length-1;g+=`<circle cx="${x(i)}" cy="${y(v)}" r="${last?4.5:2.8}" style="fill:${last?s.color:"var(--surface)"};stroke:${s.color};stroke-width:2"><title>${esc(s.name)} · ${esc(labels[i])}: ${fmt(v,dec)}</title></circle>`})}
  return `<div style="overflow-x:auto"><svg class="chart" viewBox="0 0 ${W} ${h}" width="100%" style="min-width:${Math.min(W,560)}px" role="img" aria-label="Trend chart">${g}</svg></div>`;
}
function trendPanel(key,months,rows,{unit="",dec=0,empty}){
  const sum=a=>a.reduce((x,y)=>x+(y||0),0);
  const ranked=rows.filter(r=>r.vals.some(v=>v)).sort((a,b)=>sum(b.vals)-sum(a.vals));
  if(!ranked.length)return empty;
  const st=UI.trend[key]||(UI.trend[key]={});
  let sel=(st.sel||[]).filter(id=>ranked.some(r=>r.id===id));if(!sel.length)sel=ranked.slice(0,5).map(r=>r.id);st.sel=sel;
  const colorOf=id=>{const i=sel.indexOf(id);return i<0?null:`var(--s${i%6+1})`};
  const labels=months.map(m=>MN[+m.slice(5)-1]+(UI.trendN>6||months[0].slice(0,4)!==months[months.length-1].slice(0,4)?" "+m.slice(2,4):""));
  const series=sel.map(id=>{const r=ranked.find(x=>x.id===id);return {name:r.name,vals:r.vals,color:colorOf(id)}});
  const n=months.length;
  const chg=r=>{const a=r.vals[n-2]||0,b=r.vals[n-1]||0;if(!a&&!b)return "–";if(!a)return '<span class="chip good">new</span>';const p=(b/a-1)*100;return `<span class="chip ${p>=5?"good":p<=-5?"bad":"mute"}">${p>0?"+":""}${fmt(p)}%</span>`};
  return `<section class="panel"><div class="pb" style="display:flex;flex-direction:column;gap:12px">
   <div class="chips" role="group" aria-label="Items shown on the chart">${ranked.slice(0,30).map(r=>{const c=colorOf(r.id);return `<button class="chipbtn" data-tk="${key}" data-id="${esc(r.id)}" aria-pressed="${!!c}"><i style="${c?"background:"+c:""}"></i>${esc(r.name)}</button>`}).join("")}</div>
   ${svgLines(labels,series,{dec})}
   <div class="small muted">Tap names to add or remove lines (up to 6). Hover a point for its value.</div></div></section>
  <div class="tw"><table><thead><tr><th>Item</th>${labels.map(l=>`<th class="n">${esc(l)}</th>`).join("")}<th class="n">Total</th><th class="n">vs last month</th></tr></thead><tbody>
  ${ranked.map(r=>{const c=colorOf(r.id);return `<tr><td>${c?`<span class="sw" style="background:${c};border:0"></span> `:""}${esc(r.name)}</td>${r.vals.map(v=>`<td class="n">${v?fmt(v,dec):"–"}</td>`).join("")}<td class="n"><b>${fmt(sum(r.vals),dec)}</b></td><td class="n">${chg(r)}</td></tr>`}).join("")}</tbody></table></div>
  <p class="small muted" style="margin:0">Figures in ${esc(unit)}. "vs last month" compares ${mlabel(months[n-1])} with ${mlabel(months[n-2]||months[n-1])}.</p>`;
}

function setVal(el,val,caret){el.value=val;try{el.setSelectionRange(caret,caret)}catch(e){}el.__oskDirty=true;el.dispatchEvent(new Event("input",{bubbles:true}))}
const BASE=/[က-ဪဿ၎]/,MED=/[ျြွှ]/;
function kbInsert(el,ch){
  if(!el||!document.contains(el))return;const v=el.value;let s=el.selectionStart??v.length,e=el.selectionEnd??s;
  // pending ေ / ြ typed before their consonant (visual order); kept by value so it survives the page redrawing the field
  const pend=kbPend.p;const live=!!pend&&pend.val===v&&pend.end===s&&s===e;
  const put=(val,caret,np)=>{kbPend.p=np?Object.assign(np,{val}):null;setVal(el,val,caret)};
  if(BASE.test(ch)&&live){const pre=v.slice(pend.start,s);const out=ch+(pre.includes("ြ")?"ြ":"")+(pre.includes("ေ")?"ေ":"");return put(v.slice(0,pend.start)+out+v.slice(s),pend.start+out.length)}
  if(ch==="ေ"||(ch==="ြ"&&(live||!(BASE.test(v[s-1]||"")||MED.test(v[s-1]||"")||v[s-1]==="ေ")))){return put(v.slice(0,s)+ch+v.slice(e),s+1,{start:live?pend.start:s,end:s+1})}
  if(MED.test(ch)&&s===e&&v[s-1]==="ေ"&&!live)return put(v.slice(0,s-1)+ch+"ေ"+v.slice(s),s+1);
  put(v.slice(0,s)+ch+v.slice(e),s+ch.length);
}
function kbBack(el){if(!el)return;const v=el.value;let s=el.selectionStart??v.length,e=el.selectionEnd??s;kbPend.p=null;if(s!==e)return setVal(el,v.slice(0,s)+v.slice(e),s);if(s>0)setVal(el,v.slice(0,s-1)+v.slice(s),s-1)}
function kbEnter(el){if(!el)return;if(el.tagName==="TEXTAREA")return kbInsert(el,"\n");if(el.__oskDirty){el.__oskDirty=false;el.dispatchEvent(new Event("change",{bubbles:true}))}el.dispatchEvent(new KeyboardEvent("keydown",{key:"Enter",bubbles:true,cancelable:true}))}
const showCh=c=>/[ါ-ှၖ-ၙ]/.test(c)?"◌"+c:c;
function drawKb(){
  const o=$("#osk");if(!o)return;const K=UI.kb,my=K.lang==="my",sh=K.shift;const col=my?(sh?4:3):(sh?2:1);
  o.innerHTML=`<div class="osk-head"><div class="seg" role="group" aria-label="Keyboard language"><button data-kl="my" aria-pressed="${my}" class="notr" style="display:inline-flex;gap:6px;align-items:center">${FLAG_MM}<span>မြန်မာ</span></button><button data-kl="en" aria-pressed="${!my}" class="notr" style="display:inline-flex;gap:6px;align-items:center">${FLAG_GB}<span>English</span></button></div>
   ${my?`<button class="btn sm" id="kbPhys" aria-pressed="${K.phys}" style="${K.phys?"background:var(--accent);color:var(--accent-ink);border-color:var(--accent)":""}">Type Myanmar with my own keyboard</button>`:""}
   <button class="btn sm" id="kbClose">Close keyboard</button></div>
   ${KB.map(row=>`<div class="osk-row">${row.map(k=>`<button class="key notr" data-ch="${esc(k[col])}" aria-label="${esc(k[col])}">${esc(showCh(k[col]))}</button>`).join("")}</div>`).join("")}
   <div class="osk-row"><button class="key wide ${sh?"on":""}" data-kx="shift" aria-pressed="${sh}">⇧ Shift</button><button class="key space" data-kx="space">${my?"Space · နေရာခြား":"Space"}</button><button class="key wide" data-kx="back" aria-label="Backspace">⌫</button><button class="key wide" data-kx="enter" aria-label="Enter">↵</button></div>`;
  const act=b=>{if(kbTarget&&!document.contains(kbTarget)&&kbTarget.id){const n=document.getElementById(kbTarget.id);if(n)kbTarget=n}const el=kbTarget;if(b.dataset.ch!==undefined){kbInsert(el,b.dataset.ch);if(K.shift){K.shift=false;drawKb()}}
    else if(b.dataset.kx==="shift"){K.shift=!K.shift;drawKb()}else if(b.dataset.kx==="space")kbInsert(el," ");else if(b.dataset.kx==="back")kbBack(el);else if(b.dataset.kx==="enter")kbEnter(el);
    if(el&&document.contains(el)&&document.activeElement!==el){try{el.focus({preventScroll:true})}catch(e){}}};
  o.querySelectorAll(".key").forEach(b=>{b.addEventListener("pointerdown",e=>{e.preventDefault();act(b)});b.addEventListener("mousedown",e=>e.preventDefault());b.addEventListener("click",e=>{if(e.detail===0)act(b)})});
  o.querySelectorAll("[data-kl]").forEach(b=>{b.addEventListener("mousedown",e=>e.preventDefault());b.onclick=()=>{K.lang=b.dataset.kl;K.shift=false;saveKb();drawKb()}});
  const ph=$("#kbPhys");if(ph){ph.addEventListener("mousedown",e=>e.preventDefault());ph.onclick=()=>{K.phys=!K.phys;saveKb();drawKb()}}
  $("#kbClose").onclick=()=>toggleKb(false);
  if(UI.lang==="my")trNode(o);
}
function toggleKb(on){UI.kb.open=on;$("#osk").hidden=!on;document.body.classList.toggle("kb-open",on);const b=$("#kbBtn");b.setAttribute("aria-pressed",String(on));if(on){drawKb();if(kbTarget)quietNative(kbTarget)}else restoreNative()}
$("#kbBtn").addEventListener("mousedown",e=>e.preventDefault());
$("#kbBtn").onclick=()=>toggleKb(!UI.kb.open);
document.addEventListener("keydown",e=>{const K=UI.kb;if(!K.open||K.lang!=="my"||!K.phys||e.ctrlKey||e.metaKey||e.altKey)return;const el=e.target;if(!isEditable(el)||isNumField(el))return;const k=KBMAP[e.code];if(!k)return;e.preventDefault();kbTarget=el;kbInsert(el,e.shiftKey?k[4]:k[3])},true);

$("#cmtBtn").onclick=()=>openForm({title:"Suggest a change",data:{page:curPage().name},fields:[{k:"text",label:"What should change?",type:"textarea",help:"The owner will see this in Settings."}],

let pending=false;
function scheduleRender(){if(pending)return;pending=true;requestAnimationFrame(()=>{pending=false;const a=document.activeElement;if(a&&$("#view").contains(a)&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)&&a.classList.contains("cell")){deferred=true;return}if(drawerState)return void(deferred=true);render()})}
let deferred=false;
document.addEventListener("focusout",()=>{if(deferred){setTimeout(()=>{const a=document.activeElement;if(a&&a.classList&&a.classList.contains("cell"))return;if(drawerState)return;deferred=false;render()},120)}});
const _close=closeForm;closeForm=function(){_close();if(deferred){deferred=false;render()}};
function render(){
  const pg=curPage();const al=alerts();
  $("#nav").innerHTML=PAGES.map(p=>{const n=al.filter(a=>a.dept===p.id&&a.sev!=="info").length;return `<button data-page="${p.id}" aria-current="${p.id===pg.id}"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[p.id]}</svg>${esc(p.name)}${n?`<span class="count">${n}</span>`:""}</button>`}).join("");
  $("#nav").querySelectorAll("button").forEach(b=>b.onclick=()=>go(b.dataset.page));
  $("#pageTitle").textContent=pg.name;$("#pageSub").textContent=pg.sub;
  $("#monthIn").value=UI.month;
  const t=curTab();
  $("#tabsArea").innerHTML=pg.tabs?`<div class="tabs" role="tablist">${pg.tabs.map(x=>`<button role="tab" aria-selected="${x[0]===t}" data-tab="${x[0]}">${esc(x[1])}</button>`).join("")}</div>`:"";
  $("#tabsArea").querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>go(pg.id,b.dataset.tab));
  let ban="";
  if(dbState==="off")ban=`<div class="banner bad">This copy cannot save. Open the AP Plastic ERP from Claude to see and save the factory's records.</div>`;
  else if(!canWrite)ban=`<div class="banner">You can view these records but not change them. Ask the owner for edit access.</div>`;
  const nt=set_(),note=UI.lang==="my"&&nt.notice_my?nt.notice_my:nt.notice;
  if(note)ban=`<div class="banner notr" style="background:var(--accent-soft);color:var(--ink);border-color:transparent">${esc(note)}</div>`+ban;
  $("#bannerArea").innerHTML=ban;
  const fn=pg.tabs?V[pg.id][t]:V[pg.id];
  $("#view").innerHTML=fn();
  if(fn.bind)fn.bind();
  $("#view").querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{const [p,tb]=b.dataset.go.split(":");go(p,tb)});
  $("#syncDot").className="dot"+(dbState==="on"?" on":"");$("#syncTxt").textContent=dbState==="on"?"Saved to shared records":dbState==="off"?"Not connected":"Connecting…";
}
function pickMonth(){const ms=Object.keys(S.production).filter(k=>monthBags(k)).sort();return ms[ms.length-1]||ym(today())}
$("#mPrev").onclick=()=>{UI.month=addMonth(UI.month,-1);render()};
$("#mNext").onclick=()=>{UI.month=addMonth(UI.month,1);render()};
$("#monthIn").onchange=e=>{if(/^\d{4}-\d{2}$/.test(e.target.value)){UI.month=e.target.value;render()}};

UI.month=ym(today());
document.documentElement.lang=UI.lang==="my"?"my":"en";
drawLangSeg();
render();
if(UI.lang==="my")trNode(document.body);
/* ---------------- Supabase connection ---------------- */
const CFG=window.AP_CONFIG||{};let SB=null;const SESSION={email:"",role:null};
function makeDb(){
  const subs={},cache={};let started=false;
  const emit=col=>{const m=cache[col]||new Map();const docs=[...m.entries()].map(([id,data])=>({id,exists:true,data:()=>data}));(subs[col]||[]).forEach(f=>f({docs}))};
  const err=e=>({code:e&&e.code||"unavailable",message:(e&&e.message)||"Database error"});
  return {
    async start(){
      let from=0;const P=1000;
      for(;;){const {data,error}=await SB.from("records").select("col,id,data").range(from,from+P-1);if(error)throw err(error);
        data.forEach(r=>{(cache[r.col]||(cache[r.col]=new Map())).set(r.id,r.data)});if(data.length<P)break;from+=P}
      started=true;Object.keys(subs).forEach(emit);
      SB.channel("records-live").on("postgres_changes",{event:"*",schema:"public",table:"records"},p=>{
        const r=(p.new&&p.new.col)?p.new:p.old;if(!r||!r.col)return;const m=cache[r.col]||(cache[r.col]=new Map());
        if(p.eventType==="DELETE")m.delete(r.id);else m.set(r.id,p.new.data);emit(r.col)}).subscribe();
    },
    collection(col){return {
      onSnapshot(next){(subs[col]||(subs[col]=[])).push(next);if(started)emit(col);return ()=>{}},
      doc(id){return {
        async set(data){const {error}=await SB.from("records").upsert({col,id,data});if(error)throw err(error);(cache[col]||(cache[col]=new Map())).set(id,data)},
        async delete(){const {error}=await SB.from("records").delete().eq("col",col).eq("id",id);if(error)throw err(error);cache[col]&&cache[col].delete(id)}}}}}
  };
}
const USER_DOMAIN="ap-plastic.app";
const toEmail=u=>{u=String(u||"").trim().toLowerCase();return u.includes("@")?u:u.replace(/[^a-z0-9._-]/g,"")+"@"+USER_DOMAIN};
const toName=e=>String(e||"").endsWith("@"+USER_DOMAIN)?String(e).split("@")[0]:String(e||"");
let SETUP=false;
async function showLogin(msg){$("#login").hidden=false;$("#lgMsg").textContent=msg||"";drawLangSeg();
  try{const {data}=await SB.rpc("app_has_owner");SETUP=data===false}catch(e){SETUP=false}
  $("#lgIntro").hidden=!SETUP;$("#lgPass2Box").hidden=!SETUP;
  $("#lgIntro").textContent=UI.lang==="my"?"ပထမဆုံး အသုံးပြုခြင်း - ပိုင်ရှင်၏ အသုံးပြုသူအမည်နှင့် စကားဝှက်ကို ဖန်တီးပါ။":"First-time setup: choose the owner's username and password.";
  $("#lgBtn").textContent=SETUP?(UI.lang==="my"?"ပိုင်ရှင်အကောင့် ဖန်တီးမည်":"Create owner account"):(UI.lang==="my"?"ဝင်မည်":"Sign in");
  $("#lgPass").autocomplete=SETUP?"new-password":"current-password";
  if(UI.lang==="my")trNode($("#login"));setTimeout(()=>$("#lgEmail").focus(),50)}
async function afterLogin(user){
  $("#login").hidden=true;SESSION.email=user.email||"";
  const {data:me,error}=await SB.from("app_users").select("role").eq("user_id",user.id).maybeSingle();
  if(error||!me){await SB.auth.signOut();return showLogin(UI.lang==="my"?"ဤအကောင့်ကို စနစ်ထဲ မထည့်ရသေးပါ။ ပိုင်ရှင်ကို ပြောပါ။":"This account is not set up for the app yet. Ask the owner to add you.")}
  SESSION.role=me.role;canWrite=me.role==="owner"||me.role==="editor";canSystem=me.role==="owner";
  $("#whoTxt").textContent=toName(SESSION.email)+" · "+(me.role==="owner"?"Owner":me.role==="editor"?"Editor":"Viewer");$("#signOut").hidden=false;
  if(!canWrite)$("#cmtBtn").hidden=true;
  db=makeDb();let monthPicked=false;
  COLS.forEach(c=>db.collection(c).onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{if(d.exists)o[d.id]=d.data()});S[c]=o;loaded.add(c);
    if(c==="production"&&!monthPicked){monthPicked=true;UI.month=pickMonth()}scheduleRender()}));
  try{await db.start();dbState="on"}catch(e){dbState="off";toast((e&&e.message)||"Could not load records")}
  render();
}
$("#loginForm").addEventListener("submit",async e=>{e.preventDefault();const un=$("#lgEmail").value.trim(),pw=$("#lgPass").value;const my=UI.lang==="my";
  const msg=t=>$("#lgMsg").textContent=t;
  if(!un||!pw)return msg(my?"အသုံးပြုသူအမည်နှင့် စကားဝှက် ထည့်ပါ":"Enter your username and password");
  $("#lgBtn").disabled=true;msg("");
  try{
    if(SETUP){
      if(pw.length<6)return msg(my?"စကားဝှက် အနည်းဆုံး ၆ လုံး":"Use at least 6 characters for the password");
      if(pw!==$("#lgPass2").value)return msg(my?"စကားဝှက် နှစ်ခု မတူပါ":"The two passwords are not the same");
      const {data,error}=await SB.auth.signUp({email:toEmail(un),password:pw});
      if(error)return msg(error.message);
      if(!data.session)return msg(my?"Supabase တွင် \"Confirm email\" ကို ပိတ်ရန် လိုသည်":"Turn off \"Confirm email\" in Supabase first, then try again.");
      const r=await SB.rpc("claim_owner",{uname:un});if(r.error)return msg(r.error.message);
      SETUP=false;return afterLogin(data.user);
    }
    const {data,error}=await SB.auth.signInWithPassword({email:toEmail(un),password:pw});
    if(error){const net=/fetch|network|load failed/i.test(error.message||"")||error.status===0;
      return msg(net?(my?"Supabase နှင့် ချိတ်ဆက်၍ မရပါ။ အင်တာနက် စစ်ပါ။":"Cannot reach Supabase. Check the internet connection."):/confirm/i.test(error.message||"")?(my?"ဤအကောင့်ကို အတည်မပြုရသေးပါ။":"This account is not confirmed. Turn off \"Confirm email\" in Supabase."):(my?"အသုံးပြုသူအမည် သို့မဟုတ် စကားဝှက် မှားနေသည်":"Username or password is not right"))}
    afterLogin(data.user);
  }finally{$("#lgBtn").disabled=false}});
$("#signOut").onclick=async()=>{await SB.auth.signOut();location.reload()};
(async()=>{
  if(!window.supabase||!CFG.url||!CFG.key||/PASTE/.test(CFG.key)){dbState="off";render();$("#syncTxt").textContent="Not set up";$("#bannerArea").innerHTML=`<div class="banner bad">${UI.lang==="my"?"Supabase နှင့် မချိတ်ရသေးပါ။ config.js တွင် anon key ထည့်ရန် လိုသည်။":"Not connected to Supabase yet: the anon key is missing in config.js."}</div>`;return}
  SB=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true}});
  const {data}=await SB.auth.getSession();
  if(data&&data.session)afterLogin(data.session.user);else{dbState="connecting";showLogin()}
})();
