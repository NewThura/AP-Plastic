<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Advanced Packaging</title>
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+Myanmar:wght@400;600&display=swap">
<style>
/* =========================================================
   AP Plastic: simple data app (new, 2026-11-21)
   One file: styles, page, script. Records are kept in a file
   on this computer's drive (Chrome or Edge), with a copy in
   the browser. Nothing is sent anywhere.
   ========================================================= */
:root{
  /* white interface; blue (the logo's navy) only for small touches: outlines, links, the selected item, chart bars */
  --bg:#FFFFFF; --surface:#FFFFFF; --sunk:#F5F7FA; --line:#E3E7EE; --ink:#141C2B; --muted:#5B6578;
  --pred:#EB6834; --accent:#0A2A66; --accent-ink:#FFFFFF; --accent-soft:#EEF3FB; --blue:#1F4FA8;
  --good:#1E7B4A; --good-soft:#DDF1E5; --warn:#A46200; --warn-soft:#FBEBCF; --bad:#B4322A; --bad-soft:#F8DEDB;
  --f-display:"Archivo","Noto Sans Myanmar",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Noto Sans Myanmar",system-ui,sans-serif;
  --f-data:"IBM Plex Mono","Noto Sans Myanmar",ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
html[lang="my"] body{line-height:1.75}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.brand{display:flex;flex-direction:column;gap:6px}
.logo{display:flex;align-items:center;gap:10px;line-height:1.1}
.logo img{width:44px;height:44px;display:block;flex:none}
.logo .lt{font-weight:700;font-size:14px;letter-spacing:.04em;color:var(--ink);text-transform:uppercase}
.brand span{font-size:12px;color:var(--muted);padding-left:2px}
.mhead{display:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--muted);font-weight:500}
.nav button svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8}
.nav button:hover{background:var(--sunk);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600;box-shadow:inset 3px 0 0 var(--blue)}
.nav button:focus-visible{outline:2px solid var(--accent)}
.side .foot{margin-top:auto;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:8px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-right:6px}
.dot.on{background:var(--good)} .dot.bad{background:var(--bad)}
.main{padding:24px 28px 40px;display:flex;flex-direction:column;gap:16px;min-width:0;max-width:1180px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top h1{margin:0;font:800 26px var(--f-display);letter-spacing:-.01em}
.top .sub{color:var(--muted);font-size:13px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{all:unset;cursor:pointer;padding:6px 12px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;min-height:38px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:#fff;border:1.5px solid var(--blue);color:var(--blue)}
.btn.primary:hover{background:var(--accent-soft)}
.btn.danger{color:var(--bad)} .btn.danger.arm{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:4px 10px;min-height:30px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.banner{border-radius:8px;padding:10px 14px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warn-soft);color:var(--ink)}
.banner.bad{background:var(--bad-soft)}
.banner .btns{display:flex;gap:8px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted);font-weight:500}
.kpi .v{font:600 22px/1.25 var(--f-data);font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--muted)}
.kpi .v.warn{color:var(--warn)}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bar .left{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input.search,select.pick{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-height:38px}
input.search{min-width:220px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.panel>h2{margin:0;padding:12px 16px;font:700 15px var(--f-display);border-bottom:1px solid var(--line)}
.panel>.pb{padding:14px 16px}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;font-weight:600;color:var(--muted);background:var(--sunk);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-family:var(--f-data);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
tfoot td{font-weight:600;background:var(--sunk)}
.small{font-size:12px} .muted{color:var(--muted)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:10px;white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.mute{background:var(--sunk);color:var(--muted)}
.empty{padding:36px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--ink);font-size:16px}
/* cards instead of tables on phones */
.cards{display:none;flex-direction:column}
.card{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-bottom:1px solid var(--line)}
.card:last-child{border-bottom:0}
.card .r1{display:flex;justify-content:space-between;gap:10px;font-weight:600}
.card .r1 .n{font-family:var(--f-data)}
.card .r2{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
/* side form */
.scrim{position:fixed;inset:0;background:rgba(10,15,18,.45);display:flex;justify-content:flex-end;z-index:20}
.drawer{background:var(--surface);width:min(560px,100%);height:100%;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.2)}
.drawer header,.drawer footer{padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.drawer footer{border-bottom:0;border-top:1px solid var(--line)}
.drawer h2{margin:0;font:700 18px var(--f-display)}
.drawer .body{padding:16px 18px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea,.ln input,.ln select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;min-height:40px;width:100%;min-width:0}
.field textarea{min-height:70px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus,.ln input:focus,.ln select:focus{outline:2px solid var(--accent);outline-offset:-1px;background:var(--surface)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lines{display:flex;flex-direction:column;gap:8px}
.ln{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,.8fr) minmax(0,1.1fr) minmax(0,1.2fr) 36px;gap:6px;align-items:center}
.ln input.num{text-align:right}
.lnhead{font-size:12px;font-weight:600;color:var(--muted)}
.ln .x{all:unset;cursor:pointer;text-align:center;color:var(--muted);font-size:20px;line-height:36px}
.ln .x:hover{color:var(--bad)}
.ln .amt{display:flex;align-items:center;justify-content:flex-end;min-height:40px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);font-weight:600;min-width:0;overflow:hidden;white-space:nowrap}
.sums{background:var(--sunk);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-variant-numeric:tabular-nums}
.sums div{display:flex;justify-content:space-between}
.sums b{font-family:var(--f-data)}
.sums .big{font-size:17px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:30;max-width:90vw}
/* customer details */
.checks{display:flex;flex-wrap:wrap;gap:8px 16px}
.checks label{display:flex;gap:6px;align-items:center;font-weight:400;color:var(--ink)}
.infos{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 18px}
.info{display:flex;flex-direction:column;min-width:0}
.info .l{font-size:12px;color:var(--muted);font-weight:500}
.info>span:last-child{overflow-wrap:anywhere}
tr[aria-current="true"] td{background:var(--accent-soft)}
/* charts */
.charts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.charts .wide{grid-column:1/-1}
.charts.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.chartbox{overflow-x:auto}
svg.chart{width:100%;height:auto;display:block}
svg.chart .grid{stroke:var(--line);stroke-width:1}
svg.chart .base{stroke:var(--muted);stroke-width:1}
svg.chart .ax{fill:var(--muted);font:11px var(--f-data)}
svg.chart .vl{fill:var(--ink);font:600 11px var(--f-data)}
svg.chart .bar{fill:var(--blue)}
svg.chart .hit{fill:transparent}
svg.chart .pred{fill:none;stroke:var(--pred);stroke-width:2;stroke-dasharray:5 4;pointer-events:none}
svg.chart .predot{fill:var(--pred);stroke:var(--surface);stroke-width:2;pointer-events:none}
svg.chart .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;pointer-events:none}
svg.chart .dot{stroke:var(--surface);stroke-width:2;pointer-events:none}
.predtxt{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:4px}
.predtxt i{width:16px;border-top:2px dashed var(--pred)}
.predtxt b{color:var(--ink);font:600 12px var(--f-data)}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.lg{all:unset;cursor:pointer;display:inline-flex;gap:6px;align-items:center;font-size:12px;padding:3px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.lg i{width:10px;height:10px;border-radius:3px;flex:none}
.lg[aria-pressed="false"]{color:var(--muted);text-decoration:line-through}
.lg[aria-pressed="false"] i{opacity:.25}
.lg:focus-visible{outline:2px solid var(--accent)}
svg.chart .hit.on{fill:var(--accent);fill-opacity:.08}
.hbars{display:flex;flex-direction:column;gap:8px}
.hrow{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.6fr) auto;gap:8px;align-items:center;font-size:13px;padding:2px 0}
.hrow.on{background:var(--sunk);border-radius:6px}
.hl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.htrack{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.hfill{display:block;height:100%;background:var(--blue);border-radius:0 5px 5px 0}
.hv{font:600 12px var(--f-data);text-align:right}
.tip{position:fixed;z-index:40;display:none;pointer-events:none;background:var(--ink);color:var(--bg);font:600 12px var(--f-body);padding:6px 9px;border-radius:6px;white-space:pre}
/* overview notifications */
.nav .count{margin-left:auto;background:var(--bad);color:#fff;font:600 11px var(--f-data);border-radius:9px;padding:0 6px}
.bnav button{position:relative}
.bnav .count{position:absolute;top:4px;left:calc(50% + 6px);background:var(--bad);color:#fff;font:600 10px var(--f-data);border-radius:8px;padding:0 5px}
.nsum{display:flex;flex-wrap:wrap;gap:8px}
.passwrap{display:flex;align-items:center;justify-content:center;z-index:60}
.passbox{background:var(--surface,#fff);border-radius:12px;padding:18px;width:min(320px,calc(100vw - 32px));display:flex;flex-direction:column;gap:10px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.passbox h2{margin:0;font-size:17px}
.passbox input{font-size:20px;letter-spacing:.3em;text-align:center;padding:10px}
.passbox input::placeholder{letter-spacing:normal;font-size:14px}
.passerr{color:var(--bad,#c0392b);font-size:13px;min-height:16px}
.fixcols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}@media(max-width:520px){.fixcols{grid-template-columns:1fr}}
.vrows{display:flex;flex-direction:column;gap:4px;margin:8px 0}.vrow{display:flex;justify-content:space-between;gap:10px}.vrow>span:first-child{color:var(--muted)}.vrow.big{font-weight:700;font-size:16px}.vrow.warn>span:last-child{color:var(--warn,#b26a00);font-weight:600}
.vt{width:100%;font-size:13px;margin:6px 0}.vt th,.vt td{padding:4px 2px}
.comp.click{cursor:pointer}.comp.click:hover{background:var(--sunk)}
.passb{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.passrow{display:flex;gap:6px}.passrow input{flex:1;min-width:0}
.passb .link{margin-right:auto;background:none;border:0;color:var(--muted,#667);padding:6px 0;font-size:13px}.passb .link.arm{color:var(--bad,#c0392b)}
.sapp{margin:0}
.comps{display:flex;flex-direction:column}
.compi{display:flex;flex-direction:column;gap:3px;min-width:0}
.compt{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ondot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.ondot.on{background:var(--good,#1baf7a)}
.comp{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.comp:first-child{border-top:0;padding-top:0}
.compb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.sapp .lg[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-soft);font-weight:600}
.charts.ovg{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.panel.ov>h2{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px 8px 16px}
.ovnow{display:flex;align-items:baseline;gap:6px;margin-bottom:6px;font-size:12px;color:var(--muted)}
.ovnow b{font:600 20px var(--f-data);color:var(--ink)}
.nchip{white-space:nowrap;display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border-radius:999px;font-weight:600;font-size:13px}
.nchip b{font:700 14px var(--f-data)}
.nchip.bad{background:var(--bad-soft);color:var(--bad)} .nchip.warn{background:var(--warn-soft);color:var(--warn)} .nchip.info{background:var(--sunk);color:var(--ink);display:inline-flex;flex-direction:row}
.ngroup{display:flex;flex-direction:column;gap:8px}
.ngroup h3{margin:0;display:flex;align-items:center;gap:8px;font:700 15px var(--f-display)}
.ngroup h3 i{width:10px;height:10px;border-radius:50%;background:var(--warn)}
.ngroup.bad h3 i{background:var(--bad)} .ngroup.info h3 i{background:var(--muted)}
.ncount{font:600 12px var(--f-data);color:var(--muted)}
.nlist{display:flex;flex-direction:column;gap:8px}
.nitem{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:8px;background:var(--surface);min-width:0}
.nitem.bad{border-left-color:var(--bad)} .nitem.info{border-left-color:var(--muted)}
.nitem:hover{background:var(--sunk)} .nitem:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.nic{flex:none;width:36px;height:36px;border-radius:8px;display:grid;place-items:center;background:var(--warn-soft)}
.nitem.bad .nic{background:var(--bad-soft)} .nitem.info .nic{background:var(--sunk)}
.nic svg{width:20px;height:20px;fill:none;stroke:var(--warn);stroke-width:1.8}
.nitem.bad .nic svg{stroke:var(--bad)} .nitem.info .nic svg{stroke:var(--muted)}
.nbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.narea{font-size:12px;color:var(--muted)}
.narea b{color:var(--ink)}
.ntext{font-size:14px;line-height:1.45;overflow-wrap:anywhere}
.ngo{flex:none;color:var(--accent);font-weight:600;font-size:13px}
@media (max-width:900px){.charts,.charts.c2{grid-template-columns:minmax(0,1fr)}}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{all:unset;cursor:pointer;padding:9px 14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--accent);font-weight:600;border-bottom-color:var(--blue)}
.tabs button:focus-visible{outline:2px solid var(--accent)}
.bnav{display:none}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);align-content:start}
  .side{display:none}
  .main{padding:16px 16px 96px}
  .top h1{font-size:22px}
  .mhead{display:flex;align-items:center;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
  .mhead .logo img{width:32px;height:32px} .mhead .logo .lt{font-size:12px}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:10;padding-bottom:env(safe-area-inset-bottom)}
  .bnav button{all:unset;position:relative;cursor:pointer;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;font-size:11px;color:var(--muted);text-align:center}
  .bnav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8}
  .bnav button[aria-current="true"]{color:var(--accent);font-weight:600}
  .tw{display:none} .cards{display:flex}
  input.search{min-width:0;flex:1}
  .frow{grid-template-columns:1fr}
  .ln{grid-template-columns:minmax(0,1fr) minmax(0,.9fr) minmax(0,1.2fr) 32px}
  .ln .amt{grid-column:1/-2;grid-row:3}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .kpi{padding:10px 12px} .kpi .v{font-size:18px}
  .ln>:first-child{grid-column:1/-1}
  .ln{padding-bottom:8px;border-bottom:1px dashed var(--line)}
  .lnhead{display:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="logo"><img src="logo-mark.png" alt="" width="44" height="44"><span class="lt notr">Advanced<br>Packaging</span></span></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot"><div><span class="dot" id="dot"></span><span id="sync"></span></div></div>
  </aside>
  <header class="mhead"><span class="logo"><img src="logo-mark.png" alt="" width="44" height="44"><span class="lt notr">Advanced<br>Packaging</span></span></header>
  <main class="main" id="main"></main>
</div>
<nav class="bnav" id="bnav"></nav>
<div id="drawer"></div>
<script>
"use strict";
/* ================= words (English → Myanmar) ================= */

/* ================= where records are kept =================
   Main copy: a records file on this computer's drive (Chrome / Edge, File System Access).
   Working copy: the browser (IndexedDB), so the app opens fast and still works without the file.
   File format: {app, saved, records:[{col,id,data}]} */
/* the Sales app's kinds (E:\AP\AP Sales\DATA.md), fetched from the cloud and kept here as they are */
const SALES_COLS=["users","receipts","receiptPayments","receiptReturns","productList","salesOrders","salesQuotes","computers","appSettings","shop","customerEdits","receiptFixes"];
const COLS=["products","customers","sales","payments","materials","matMoves","made","waste","outbox",...SALES_COLS];
let DBV=0;   // goes up on every change, so views of the records can be kept until something changes
const DB={};COLS.forEach(c=>DB[c]={});
const Store={
  idb:null,ready:false,
  /* records are saved into a folder the owner chooses once (for example E:\AP Records):
     ap-records.json holds everything and is updated after every change; ap-records-YYYY-MM.json is the copy for
     each month, started by itself when a new month begins, so every month is kept in its own file. */
  file:{handle:null,name:"",state:"none",err:false,timer:null,saving:false,again:false}, // none | need | on | nosupport
  MAIN:"ap-records.json",monthFile:()=>"ap-records-"+ym(today())+".json",
  open(){return new Promise((ok,bad)=>{const r=indexedDB.open("ap-sales-app",2);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains("records"))d.createObjectStore("records",{keyPath:["col","id"]});if(!d.objectStoreNames.contains("meta"))d.createObjectStore("meta");if(!d.objectStoreNames.contains("backups"))d.createObjectStore("backups",{keyPath:"day"})};r.onsuccess=()=>ok(r.result);r.onerror=()=>bad(r.error)})},
  tx(store,mode,fn){return new Promise((ok,bad)=>{const x=this.idb.transaction(store,mode);const req=fn(x.objectStore(store));x.oncomplete=()=>ok(req&&req.result);x.onerror=()=>bad(x.error)})},
  all(){const out=[];for(const c of COLS)for(const [id,data] of Object.entries(DB[c]))out.push({col:c,id,data});return out},
  async replaceAll(recs){await this.tx("records","readwrite",st=>{st.clear();recs.forEach(r=>st.put(r))});COLS.forEach(c=>DB[c]={});recs.forEach(r=>{if(DB[r.col])DB[r.col][r.id]=r.data});DBV++},
  async readFile(dir){let h;try{h=await dir.getFileHandle(this.MAIN)}catch(e){return null}
    const txt=await (await h.getFile()).text();if(!txt.trim())return [];const j=JSON.parse(txt);return (j.records||[]).filter(r=>r&&COLS.includes(r.col)&&r.id&&r.data)},
  async writeOne(name,body){const h=await this.file.handle.getFileHandle(name,{create:true});const w=await h.createWritable();await w.write(body);await w.close()},
  async writeFile(){const F=this.file;if(F.state!=="on")return;if(F.saving){F.again=true;return}F.saving=true;
    try{const body=JSON.stringify({app:"AP Plastic",saved:new Date().toISOString(),records:this.all()});await this.writeOne(this.MAIN,body);await this.writeOne(this.monthFile(),body);if(F.err){F.err=false;render()}}
    catch(e){if(!F.err){F.err=true;toast(t("Could not save to the records file"));render()}}
    finally{F.saving=false;if(F.again){F.again=false;this.writeFile()}}},
  soon(){clearTimeout(this.file.timer);this.file.timer=setTimeout(()=>{this.writeFile();this.autoBackup()},300)},
  /* automatic backup, not shown in the app: one copy of all records per day, taken the first time
     the app is used that day (so a mistake made today can be undone back to the start of the day),
     the last 30 days kept, in this browser next to the records file.
     To bring one back, open the browser console: apBackups() lists the days, apRestore("2026-11-21") restores one. */
  KEEP:30,
  async autoBackup(){try{const recs=this.all();if(!recs.length)return;
    if(await this.tx("backups","readonly",st=>st.getKey(today())))return;
    await this.tx("backups","readwrite",st=>st.put({day:today(),saved:new Date().toISOString(),records:recs}));
    const days=(await this.tx("backups","readonly",st=>st.getAllKeys())||[]).sort();
    if(days.length>this.KEEP)await this.tx("backups","readwrite",st=>{days.slice(0,days.length-this.KEEP).forEach(d=>st.delete(d))})}catch(e){}},
  async link(h){const F=this.file;F.handle=h;F.name=h.name;F.state="on";F.err=false;await this.tx("meta","readwrite",st=>st.put(h,"folder"))},
  async start(){
    this.idb=await this.open();
    (await this.tx("records","readonly",st=>st.getAll())||[]).forEach(r=>{if(DB[r.col])DB[r.col][r.id]=r.data});
    const F=this.file;
    if(!window.showDirectoryPicker)F.state="nosupport";
    else{const h=await this.tx("meta","readonly",st=>st.get("folder"));
      if(h){F.handle=h;F.name=h.name;let p="prompt";try{p=await h.queryPermission({mode:"readwrite"})}catch(e){}
        if(p==="granted"){try{const recs=await this.readFile(h);F.state="on";if(recs)await this.replaceAll(recs);else this.soon()}catch(e){F.state="need"}}else F.state="need"}}
    try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
    this.ready=true;
    this.autoBackup();
  },
  canChange(){return this.ready&&this.file.state!=="need"},
  async put(col,id,data,fromCloud){await this.tx("records","readwrite",st=>st.put({col,id,data}));DB[col][id]=data;DBV++;if(!fromCloud)Cloud.queue(col,id,data);this.soon()},
  async del(col,id,fromCloud){await this.tx("records","readwrite",st=>st.delete([col,id]));delete DB[col][id];DBV++;if(!fromCloud)Cloud.queue(col,id,null);this.soon()},
  async reopen(){const F=this.file;const p=await F.handle.requestPermission({mode:"readwrite"});if(p!=="granted")return false;const recs=await this.readFile(F.handle);F.state="on";F.err=false;if(recs)await this.replaceAll(recs);else await this.writeFile();return true},
  // choose the folder once; if it already holds records they are loaded, otherwise the records here are saved into it
  async chooseFolder(){const h=await showDirectoryPicker({id:"ap-records",mode:"readwrite"});const recs=await this.readFile(h);if(recs)await this.replaceAll(recs);await this.link(h);await this.writeFile()}
};
async function save(col,id,data,msg){if(!Store.canChange())return toast(t("Records file not open"));try{const before=DB[col][id]?JSON.parse(JSON.stringify(DB[col][id])):null;await Store.put(col,id,data);if(msg)toast(t(msg));render()}catch(e){toast(String(e.message||e))}}
async function remove(col,id,msg){if(!Store.canChange())return;const before=DB[col][id]?JSON.parse(JSON.stringify(DB[col][id])):null;await Store.del(col,id);if(msg)toast(t(msg));render()}
/* ================= the cloud (Cloudflare) =================
   Records are kept on this computer (above) AND in the cloud. Every change waits in a queue (kept in the browser,
   so nothing is lost without internet) and is sent within a few seconds; every 30 seconds the app fetches what
   other computers changed. The key is pasted once in Settings and kept only on this computer.
   First link: the cloud's records come first (so an older computer never overwrites newer records),
   then the records only this computer has are sent up. */
const Cloud={
  URL:ls("ap2.cloudUrl")||"https://ap-plastic-cloud.applastic.workers.dev",
  key:"",since:"",q:{},state:"off",  // off | ok | sending | offline | badkey
  last:"",timer:null,busy:false,
  async load(){const g=k=>Store.tx("meta","readonly",st=>st.get(k));this.key=(await g("cloudKey"))||"";this.since=(await g("cloudSince"))||"";this.q=(await g("cloudQ"))||{};
    // when the app learns new kinds of records, fetch everything once more so the older ones of those kinds arrive too
    const sig=COLS.join(",");if(this.key&&(await g("cloudCols"))!==sig){this.since="";await this.setMeta("cloudCols",sig)}
    if(this.key){this.state="ok";this.run()}},
  setMeta(k,v){return Store.tx("meta","readwrite",st=>st.put(v,k))},
  queue(col,id,data){if(!this.key)return;this.q[col+"\u0001"+id]={col,id,data:data||{},deleted:!data};this.setMeta("cloudQ",this.q);
    clearTimeout(this.timer);this.timer=setTimeout(()=>this.run(),2000)},
  async call(path,body){const r=await fetch(this.URL+path,{method:body?"POST":"GET",headers:{"X-AP-Key":this.key,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
    if(r.status===401){const e=new Error("badkey");e.badkey=true;throw e}if(!r.ok)throw new Error("HTTP "+r.status);return r.json()},
  // records from the cloud: saved here without going back into the queue; a change still waiting here wins
  async apply(recs){let n=0;for(const r of recs){if(!COLS.includes(r.col)||this.q[r.col+"\u0001"+r.id])continue;
      if(r.deleted){if(DB[r.col][r.id]){await Store.del(r.col,r.id,true);n++}}
      else if(JSON.stringify(DB[r.col][r.id])!==JSON.stringify(r.data)){await Store.put(r.col,r.id,r.data,true);n++}}
    if(n){clearTimeout(Store.file.timer);await Store.writeFile()}   // into the records file at once, so closing the app straight after loses nothing
    return n},
  async send(){const keys=Object.keys(this.q);for(let i=0;i<keys.length;i+=40){const part=keys.slice(i,i+40);
      await this.call("/records",{records:part.map(k=>this.q[k])});part.forEach(k=>delete this.q[k]);await this.setMeta("cloudQ",this.q)}},
  async run(){if(!this.key||this.busy)return;this.busy=true;const was=this.state;
    try{if(Object.keys(this.q).length){this.state="sending";paint()}
      await this.send();
      const j=await this.call("/records"+(this.since?"?since="+encodeURIComponent(this.since):""));
      const n=await this.apply(j.records||[]);this.since=j.now;await this.setMeta("cloudSince",this.since);
      this.state="ok";this.last=new Date().toISOString();if(n){await moveOldProducts();render()}}
    catch(e){this.state=e.badkey?"badkey":"offline"}
    finally{this.busy=false;if(this.state!==was||this.state!=="ok")paint()}},
  async link(key){const was=this.key;this.key=key.trim();
    try{const j=await this.call("/records");this.q={};await this.apply(j.records||[]);
      const inCloud=new Set((j.records||[]).map(r=>r.col+"\u0001"+r.id));
      Store.all().forEach(r=>{if(!inCloud.has(r.col+"\u0001"+r.id))this.q[r.col+"\u0001"+r.id]={col:r.col,id:r.id,data:r.data,deleted:false}});
      this.since=j.now;await this.setMeta("cloudCols",COLS.join(","));await this.setMeta("cloudKey",this.key);await this.setMeta("cloudSince",this.since);await this.setMeta("cloudQ",this.q);
      this.state="ok";await moveOldProducts();await this.run();return true}
    catch(e){this.key=was;this.state=was?this.state:"off";toast(t(e.badkey?"Wrong key":"Cloud not reached"));return false}},
  async unlink(){this.key="";this.since="";this.q={};this.state="off";for(const k of ["cloudKey","cloudSince","cloudQ"])await Store.tx("meta","readwrite",st=>st.delete(k))}};
setInterval(()=>Cloud.run(),30000);
window.addEventListener("online",()=>Cloud.run());
// the save status in the corner, without drawing the whole page again
function paint(){const [cls,txt]=syncText();const d=$("#dot"),sy=$("#sync");if(d)d.className="dot "+cls;if(sy)sy.textContent=txt;const c=$("#cloudNow");if(c)c.outerHTML=cloudChip()}
function cloudChip(){const st=Cloud.state,n=Object.keys(Cloud.q).length;
  const [cls,l]=st==="badkey"?["bad","Wrong key"]:st==="offline"?["warn","Cloud not reached"]:n?["","Sending to the cloud"]:["good","Saved to the cloud"];
  return `<span class="chip ${cls}" id="cloudNow">${T(l)}${n&&st!=="badkey"?` · <span class="notr">${n}</span>`:""}</span>`}
/* Passcode: important actions (records folder, cloud, the Sales app's tabs, computers, accounts) ask for it,
   so nothing changes by accident. Kept only on this computer, as a PBKDF2 hash (never the passcode itself).
   After a right passcode, more important actions work for one minute without asking again.
   Forgotten? In the browser console: apResetPasscode() (then set a new one in Settings). */
const PASS={okUntil:0,GRACE:60000};
const passGet=()=>Store.tx("meta","readonly",st=>st.get("passcode"));
async function passSet(code){const salt=[...crypto.getRandomValues(new Uint8Array(16))].map(x=>x.toString(16).padStart(2,"0")).join("");
  const hash=await passHash(code,salt);await Store.tx("meta","readwrite",st=>st.put({salt,hash},"passcode"))}
window.apResetPasscode=async()=>{await Store.tx("meta","readwrite",st=>st.delete("passcode"));PASS.okUntil=0;return "Passcode removed. Set a new one in Settings."};
// one small box over the page; resolves true (right passcode / new one set) or false (cancel)
function passBox(mode){return new Promise(done=>{const el=document.createElement("div");el.className="scrim passwrap";
  const two=mode==="new";
  el.innerHTML=`<div class="passbox" role="dialog" aria-modal="true" aria-labelledby="pT">
    <h2 id="pT">${T(two?"Set a passcode":"Passcode")}</h2>
    <div class="passrow"><input id="p1" type="password" inputmode="numeric" autocomplete="off" maxlength="16" placeholder="${T(two?"New passcode (4 to 8 numbers)":"Enter the passcode")}"><button class="btn sm" id="pS" type="button">${T("Show")}</button></div>
    ${two?`<input id="p2" type="password" inputmode="numeric" autocomplete="off" maxlength="16" placeholder="${T("Passcode again")}">`:""}
    <div class="passerr" id="pE"></div>
    <div class="passb">${two?"":`<button class="btn link" id="pF" type="button">${T("Forgot passcode?")}</button>`}<button class="btn" id="pC">${T("Cancel")}</button><button class="btn primary" id="pO">${T("OK")}</button></div></div>`;
  document.body.appendChild(el);const q=k=>el.querySelector(k),err=m=>{q("#pE").textContent=t(m);q("#p1").value="";if(q("#p2"))q("#p2").value="";q("#p1").focus()};
  const end=v=>{el.remove();done(v)};
  q("#pC").onclick=()=>end(false);el.onclick=e=>{if(e.target===el)end(false)};
  el.onkeydown=e=>{if(e.key==="Escape")end(false);if(e.key==="Enter")q("#pO").click()};
  // Myanmar numbers (၁၂၃) count the same as 1 2 3; spaces and dashes are ignored
  const digits=v=>v.replace(/[၀-၉]/g,d=>String(d.charCodeAt(0)-0x1040)).replace(/[\s-]/g,"");
  q("#pS").onclick=()=>{const h=q("#p1").type==="password";el.querySelectorAll("input").forEach(i=>i.type=h?"text":"password");q("#pS").textContent=t(h?"Hide":"Show")};
  const f=q("#pF");if(f)f.onclick=async()=>{if(!f.classList.contains("arm")){f.classList.add("arm");f.textContent=t("Tap again to remove it");return}
    await window.apResetPasscode();el.remove();done(await passBox("new"))};
  q("#pO").onclick=async()=>{const a=digits(q("#p1").value);
    if(two){if(!/^\d{4,8}$/.test(a))return err("Use 4 to 8 numbers");if(a!==digits(q("#p2").value))return err("The two passcodes are not the same");
      await passSet(a);PASS.okUntil=Date.now()+PASS.GRACE;toast(t("Passcode saved"));return end(true)}
    // the box once stopped at 8 numbers, so a longer number is also tried as its first 8
    const pc=await passGet();for(const x of new Set([a,a.slice(0,8)]))if(pc&&x&&await passHash(x,pc.salt)===pc.hash){PASS.okUntil=Date.now()+PASS.GRACE;return end(true)}
    err("Wrong passcode")};
  setTimeout(()=>q("#p1").focus(),0)})}

/* ================= reading the records ================= */
const rawList=c=>Object.entries(DB[c]).map(([id,d])=>Object.assign({id},d));
/* The Sales app's receipts, payments and returns, turned into the main app's shapes so every page, graph and
   alert counts them. They can only be changed in the Sales app. Lines become dozens where the size is known
   (pieces ÷ 12, bags × pieces per bag ÷ 12), keeping the same amount in Kyat. */
let SV={v:-1};const SALEPN={};
const PAYWAY={cash:"Cash",kbzpay:"KBZPay",kbz:"Bank",ayapay:"Bank",cbpay:"Bank",wave:"Other",bank:"Bank",other:"Other"};
function salesView(){if(SV.v===DBV)return SV;
  const line=l=>{const pl=DB.productList[l.productId]||{},k=l.productId&&DB.productList[l.productId]?l.productId:"pl:"+(l.productId||l.name||"?");SALEPN[k]=pl.name||l.name||"?";
    const amt=num(l.amount)||num(l.qty)*num(l.shownPrice||l.price);let qty=num(l.qty),unit=l.unit;
    if(unit==="pc"){qty=qty/12;unit="dz"}else if(unit==="bag"&&num(pl.perBag)){qty=qty*num(pl.perBag)/12;unit="dz"}
    return {p:k,unit,qty,price:qty?amt/qty:0}};
  const sales=rawList("receipts").map(r=>({id:"sa:"+r.id,fromSales:1,no:r.no,date:r.date||"",cust:r.customerId||"",lines:(r.lines||[]).map(line),
    total:num(r.total),paid:num(r.paid),term:r.term,note:r.note}));
  const pays=rawList("receiptPayments").map(x=>({id:"sp:"+x.id,fromSales:1,no:x.no,date:x.date||"",cust:x.customerId||"",amount:num(x.amount),method:PAYWAY[x.method]||"Other"}));
  const rets=rawList("receiptReturns").map(x=>({cust:x.customerId||"",amount:num(x.amount),sale:x.receiptId?"sa:"+x.receiptId:""}));
  SV={v:DBV,sales,pays,rets};return SV}
const list=c=>c==="sales"?rawList(c).concat(salesView().sales):c==="payments"?rawList(c).concat(salesView().pays):rawList(c);
/* ONE product list for the main app and the Sales app: the Sales app's "productList"
   {name, brand, piecePrice, perBag (pieces), active} plus the main app's own fields kept in the same record
   {my (Myanmar name), openDz, minDz}. The main app's pages see it in their own shape (price per dozen, dozens per bag).
   Products from before (kind "products") are moved into productList once, with the same id, so old sales still point at them. */
let PV={v:-1,o:{}};
function plToView(pl){const pb=num(pl.perBag);let pc=pl.piecePrice!=null&&pl.piecePrice!==""?num(pl.piecePrice):0;
  if(!pc&&pl.price)pc=pl.unit==="dz"?num(pl.price)/12:pl.unit==="pc"?num(pl.price):pl.unit==="bag"&&pb?num(pl.price)/pb:0;   // older Sales products: one price for one unit
  return {my:pl.my||"",en:pl.name||"",brand:pl.brand||"AP",priceDz:pc?Math.round(pc*12):"",priceBag:pc&&pb?Math.round(pc*pb):"",perBag:pb?pb/12:"",
    active:pl.active!==false,openDz:pl.openDz??"",minDz:pl.minDz??"",fromSales:pl.updatedBy&&pl.updatedBy!=="main"}}
function viewToPl(d,old){const perBagPc=Math.round(num(d.perBag)*12);
  const pc=num(d.priceDz)?num(d.priceDz)/12:num(d.priceBag)&&perBagPc?num(d.priceBag)/perBagPc:0;
  return Object.assign({},old||{},{name:d.en||d.my||"",my:d.my||"",brand:d.brand||"AP",piecePrice:Math.round(pc*10000)/10000,perBag:perBagPc,
    active:d.active!==false,openDz:d.openDz??"",minDz:d.minDz??"",updatedBy:"main",updatedAt:Date.now()})}
function PRODS(){if(PV.v===DBV)return PV.o;const o={};
  Object.entries(DB.products).forEach(([id,x])=>o[id]=x);                       // not moved yet
  Object.entries(DB.productList).forEach(([id,x])=>o[id]=plToView(x));
  PV={v:DBV,o};return o}
const prodList=()=>Object.entries(PRODS()).map(([id,d])=>Object.assign({id},d));
async function moveOldProducts(){const old=rawList("products");if(!old.length||!Store.canChange())return;
  for(const x of old){const {id,...d}=x;if(!DB.productList[id])await Store.put("productList",id,viewToPl(d));await Store.del("products",id)}}
const prodLabel=k=>PRODS()[k]?prodName(PRODS()[k]):(SALEPN[k]||"?");
const byName=(a,b)=>(a.name||"").localeCompare(b.name||"");

const lineAmt=l=>num(l.qty)*num(l.price);
const saleGoods=s=>(s.lines||[]).reduce((a,l)=>a+lineAmt(l),0);
const saleTotal=s=>s.fromSales?num(s.total):saleGoods(s)+num(s.delivery);
const unitWord=(u,q)=>u==="bag"?t(num(q)===1?"Bag":"bags"):t("dz");
const lineText=lines=>(lines||[]).map(l=>`${prodLabel(l.p)} ${fmt(l.qty,1)} ${unitWord(l.unit,l.qty)}`).join(", ");
function balances(){const b={};list("sales").forEach(s=>{if(s.cust)b[s.cust]=(b[s.cust]||0)+saleTotal(s)-num(s.paid)});list("payments").forEach(p=>{if(p.cust)b[p.cust]=(b[p.cust]||0)-num(p.amount)});salesView().rets.forEach(p=>{if(p.cust)b[p.cust]=(b[p.cust]||0)-p.amount});return b}
// money received per sale: paid with the sale, plus later payments used for that customer's oldest sales first
function paidMap(){const pool={},out={},own={},sales=list("sales"),ids=new Set(sales.map(s=>s.id));
  salesView().rets.forEach(r=>{if(r.sale&&ids.has(r.sale))own[r.sale]=(own[r.sale]||0)+num(r.amount)});
  list("payments").concat(salesView().rets.filter(r=>!(r.sale&&ids.has(r.sale)))).forEach(p=>{if(p.cust)pool[p.cust]=(pool[p.cust]||0)+num(p.amount)});
  // a return bigger than its receipt's balance: the rest goes to the customer's other receipts
  sales.forEach(s=>{if(own[s.id]){const room=Math.max(0,saleTotal(s)-num(s.paid)),x=Math.max(0,own[s.id]-room);if(x&&s.cust)pool[s.cust]=(pool[s.cust]||0)+x;own[s.id]-=x}});
  sales.sort((a,b)=>(a.date||"").localeCompare(b.date||"")||num(a.no)-num(b.no)).forEach(s=>{const tot=saleTotal(s);let pd=num(s.paid)+(own[s.id]||0);
    if(pd<tot&&s.cust&&pool[s.cust]>0){const take=Math.min(pool[s.cust],tot-pd);pd+=take;pool[s.cust]-=take}out[s.id]=pd});return out}
let PAID={};
const saleOwed=s=>Math.max(0,saleTotal(s)-(PAID[s.id]??num(s.paid)));

/* ---- charts: one series each, the app's main colour, a tooltip on every bar ---- */
// top of the scale: four equal, round steps (so the axis reads 0, 25, 50, 75, 100 and never 12.5 or 37.5)
function niceMax(v){if(v<=0)return 4;const st=v/4,p=Math.pow(10,Math.floor(Math.log10(st)));const f=st/p;return 4*(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
const short=v=>v>=1e6?fmt(v/1e6,v%1e5?2:v%1e6?1:0)+"M":v>=1e3?fmt(v/1e3,v%1e3?1:0)+"k":fmt(v,v%1?1:0);
function barChart(data,{h=190,labelEvery=1,tip,pred}={}){
  const W=Math.max(320,data.length*(data.length>20?(innerWidth<760?12:32):56)),pl=44,pr=8,pt=22,pb=24,iw=W-pl-pr,ih=h-pt-pb;
  const top=niceMax(Math.max(...data.map(d=>d.v),...(pred||[]).map(p=>p.v),0));const step=iw/data.length,bw=Math.max(4,Math.min(36,step*.62));
  let g="";for(let i=0;i<=4;i++){const v=top*i/4,y=pt+ih-ih*i/4;g+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text class="ax" x="${pl-6}" y="${y+4}" text-anchor="end">${short(v)}</text>`}
  const maxI=data.reduce((m,d,i)=>d.v>data[m].v?i:m,0);
  data.forEach((d,i)=>{const cx=pl+step*(i+.5),bh=ih*d.v/top,y=pt+ih-bh;
    if(d.v>0&&!d.future){const r=Math.min(4,bw/2,bh);g+=`<path class="bar" d="M${cx-bw/2},${pt+ih}V${y+r}Q${cx-bw/2},${y} ${cx-bw/2+r},${y}H${cx+bw/2-r}Q${cx+bw/2},${y} ${cx+bw/2},${y+r}V${pt+ih}Z"/>`}
    if(i%labelEvery===0||i===data.length-1)g+=`<text class="ax" x="${cx}" y="${h-7}" text-anchor="middle">${esc(d.l)}</text>`;
    if(i===maxI&&d.v>0&&!pred)g+=`<text class="vl" x="${cx}" y="${y-6}" text-anchor="middle">${short(d.v)}</text>`;
    g+=`<rect class="hit" x="${pl+step*i}" y="${pt}" width="${step}" height="${ih}" data-tip="${esc(tip(d))}"/>`});
  if(pred&&pred.length){const X=i=>pl+step*(i+.5),Y=v=>pt+ih-ih*v/top;
    g+=`<path class="pred" d="${pred.map((p,k)=>(k?"L":"M")+X(p.i).toFixed(1)+","+Y(p.v).toFixed(1)).join("")}"/>`+pred.slice(1).map(p=>`<circle class="predot" cx="${X(p.i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="4"/>`).join("")}
  return `<div class="chartbox"><svg class="chart" viewBox="0 0 ${W} ${h}" role="img">${g}<line class="base" x1="${pl}" x2="${W-pr}" y1="${pt+ih}" y2="${pt+ih}"/></svg></div>`}
// product line colours, fixed order, never cycled. Orange is left out: orange means "prediction" in this app.
const PAL=["#2a78d6","#1baf7a","#eda100","#6250d6","#e34948","#008300","#e87ba4","#7a7a7a"];
function lineChart(labels,series,tip){const ph=innerWidth<760,W=ph?360:720,h=ph?230:260,pl=44,named=!ph&&series.filter(x=>!x.off).length<=4,pr=named?110:14,pt=16,pb=24,iw=W-pl-pr,ih=h-pt-pb;
  const vis=series.filter(x=>!x.off);const top=niceMax(Math.max(0,...vis.flatMap(x=>x.vals)));
  const step=iw/Math.max(1,labels.length-1),X=i=>pl+step*i,Y=v=>pt+ih-ih*v/top;let g="";
  for(let i=0;i<=4;i++){const v=top*i/4,y=pt+ih-ih*i/4;g+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text class="ax" x="${pl-6}" y="${y+4}" text-anchor="end">${short(v)}</text>`}
  labels.forEach((l,i)=>{g+=`<text class="ax" x="${X(i)}" y="${h-7}" text-anchor="middle">${esc(l)}</text>`});
  vis.forEach(x=>{g+=`<path class="ln" stroke="${x.color}" d="${x.vals.map((v,i)=>(i?"L":"M")+X(i).toFixed(1)+","+Y(v).toFixed(1)).join("")}"/>`+x.vals.map((v,i)=>`<circle class="dot" fill="${x.color}" cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="4"/>`).join("")});
  // names at the end of each line (up to 4 lines), moved apart so they never overlap
  if(named){const ends=vis.map(x=>({n:x.name.length>14?x.name.slice(0,13)+"…":x.name,y:Y(x.vals[x.vals.length-1])})).sort((a,b)=>a.y-b.y);
    ends.forEach((e,k)=>{if(k&&e.y-ends[k-1].y<13)e.y=ends[k-1].y+13});ends.forEach(e=>{g+=`<text class="vl" x="${X(labels.length-1)+8}" y="${(e.y+4).toFixed(1)}">${esc(e.n)}</text>`})}
  labels.forEach((l,i)=>{const x0=Math.max(pl,X(i)-step/2),x1=Math.min(W-pr,X(i)+step/2);g+=`<rect class="hit" x="${x0}" y="${pt}" width="${x1-x0}" height="${ih}" data-tip="${esc(tip(i,vis))}"/>`});
  const legend=`<div class="legend">${series.map(x=>`<button class="lg" data-lg="${esc(x.id)}" aria-pressed="${!x.off}"><i style="background:${x.color}"></i><span class="notr">${esc(x.name)}</span></button>`).join("")}</div>`;
  return legend+`<div class="chartbox"><svg class="chart" viewBox="0 0 ${W} ${h}" role="img">${g}<line class="base" x1="${pl}" x2="${W-pr}" y1="${pt+ih}" y2="${pt+ih}"/></svg></div>`}

// Sales prediction (only for the month we are in): this month = sales so far ÷ days gone × days in the month;

function salesForecast(m){const d=perMonth(m,list("sales"),saleTotal);if(m!==ym(today()))return {d};
  const day=+today().slice(8,10),dim=new Date(+m.slice(0,4),+m.slice(5,7),0).getDate(),proj=d[5].v/Math.max(1,day)*dim;

// Money is overdue when: month-end customers, the month of the sale is over; everyone else, the sale is more than 30 days old.
// dates are worked out in UTC so the Myanmar time zone (UTC+6:30) cannot move them by a day
function dueDate(s){const c=DB.customers[s.cust];const [y,mo]=s.date.split("-").map(Number);
  if((c&&(c.terms==="Month-end"||c.term==="month"))||s.term==="month")return new Date(Date.UTC(y,mo,0)).toISOString().slice(0,10);
  const d=new Date(s.date+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+30);return d.toISOString().slice(0,10)}
const daysBetween=(a,b)=>Math.round((new Date(b+"T00:00:00Z")-new Date(a+"T00:00:00Z"))/864e5);
function alerts(){const out=[],F=Store.file,td=today(),K=" "+t("Kyat");
  if(!Store.ready)return out;
  if(F.state==="need")out.push({sev:"bad",area:"Settings",go:()=>go("settings"),txt:t("Records file is closed")});
  if(F.state==="on"&&F.err)out.push({sev:"bad",area:"Settings",go:()=>go("settings"),txt:t("Could not save to the records file")});
  // the same number given twice by two Sales app computers that were offline at the same time
  ["receipts","receiptPayments","receiptReturns","salesOrders","salesQuotes"].forEach(c=>{const seen={};rawList(c).forEach(x=>{if(x.no)(seen[x.no]=seen[x.no]||[]).push(x)});
    Object.entries(seen).filter(([,a])=>a.length>1).forEach(([no,a])=>{const pcs=[...new Set(a.map(x=>{const k=DB.computers[x.pc];return k?(k.windowsName||k.code):x.pc?String(x.pc).slice(2,6).toUpperCase()+"…":"?"}))];
      out.push({sev:"bad",area:"Sales",go:()=>go("receipts"),txt:t("The same number was given twice")+": "+no+" ("+a.length+") · "+pcs.join(", ")})})});
  // overdue money, one line per customer
  const over={};list("sales").forEach(s=>{const o=saleOwed(s);if(s.cust&&o>0.5&&dueDate(s)<td){const x=over[s.cust]||(over[s.cust]={amt:0,oldest:s.date});x.amt+=o;if(s.date<x.oldest)x.oldest=s.date}});
  Object.entries(over).sort((a,b)=>b[1].amt-a[1].amt).forEach(([c,x])=>out.push({sev:"bad",area:"Customers",head:custName(c),go:()=>openCustomer(c),
    txt:`${t("Overdue")}: ${fmt(x.amt)}${K} · ${t("oldest sale")} ${x.oldest} (${daysBetween(x.oldest,td)} ${t("days")})`}));
  const notDue=list("sales").filter(s=>saleOwed(s)>0.5&&dueDate(s)>=td);
  if(notDue.length)out.push({sev:"warn",area:"Sales",go:()=>go("receipts"),txt:`${notDue.length} ${t("sales not paid yet, not overdue")} (${fmt(notDue.reduce((a,s)=>a+saleOwed(s),0))}${K})`});
  const noPrice=prodList().filter(p=>p.active!==false&&!num(p.priceDz)&&!num(p.priceBag));
  if(noPrice.length)out.push({sev:"warn",area:"Finished products",go:()=>go("finished"),txt:`${t("No price set")}: ${noPrice.map(prodName).join(", ")}`});
  // production
  const ms=matStock();list("materials").forEach(m=>{if(num(m.min)&&ms[m.id]<num(m.min))out.push({sev:"warn",area:"Raw materials",head:m.name,go:()=>go("raw"),txt:`${t("Low")}: ${fmt(ms[m.id],1)} ${t(m.unit||"lb")} (${t("minimum")} ${fmt(m.min)})`})});
  const fs=fgStock();prodList().forEach(p=>{if(p.active===false)return;const v=fs[p.id]||0;
    if(v<0)out.push({sev:"bad",area:"Finished products",head:prodName(p),go:()=>go("finished"),txt:`${t("More sold than made")}: ${fmt(v,1)} ${t("dz")}`});
    else if(num(p.minDz)&&v<num(p.minDz))out.push({sev:"warn",area:"Finished products",head:prodName(p),go:()=>go("finished"),txt:`${t("Low")}: ${fmt(v,1)} ${t("dz")} (${t("minimum")} ${fmt(p.minDz)})`})});
  const wp=wastePct(ym(td));if(wp!=null&&wp>WASTE_LIMIT)out.push({sev:"warn",area:"Waste products",go:()=>go("waste"),txt:`${t("Waste is high")}: ${fmt(wp,1)}% ${t("of material used")}`});
  const tdS=list("sales").filter(s=>s.date===td);
  out.push({sev:"info",area:"Sales",go:()=>go("receipts"),txt:tdS.length?`${t("Today")}: ${tdS.length} ${t(tdS.length===1?"sale":"sales")}, ${fmt(tdS.reduce((a,s)=>a+saleTotal(s),0))}${K}`:t("No sales written today yet.")});
  const noPhone=list("customers").filter(c=>!c.phone);
  if(noPhone.length)out.push({sev:"info",area:"Customers",go:()=>go("customers"),txt:`${t("No phone number")}: ${noPhone.map(c=>c.name).join(", ")}`});
  const ce=Cloud.key?rawList("customerEdits").filter(e=>!e.seen&&DB.customers[e.customerId]):[];const ceC=[...new Set(ce.map(e=>e.customerId))];
  if(ceC.length)out.push({sev:"info",area:"Customers",go:()=>openCustomer(ceC[0]),txt:`${t("Changed in the Sales app")}: ${ceC.map(custName).join(", ")}`});
  const late=ordersOpen().filter(orderLate);if(late.length)out.push({sev:"warn",area:"Orders",go:()=>go("orders"),txt:`${t("Orders past their delivery day")}: ${late.map(x=>x.no).join(", ")}`});
  // everything waiting for the owner's yes opens the Permissions page
  const wc=Cloud.key?waitingComps():[];if(wc.length)out.push({sev:"warn",area:"Permissions",go:()=>go("permissions"),txt:`${t("Waiting to be accepted")}: ${wc.map(c=>c.windowsName||c.code||c.id).join(", ")}`});
  const fx=Cloud.key?pendingFixes():[];if(fx.length)out.push({sev:"warn",area:"Permissions",go:()=>go("permissions"),txt:`${t("Receipt corrections to approve")}: ${fx.map(f=>f.receiptNo).join(", ")}`});
  const oc=Cloud.key?outsideComps():[];if(oc.length)out.push({sev:"warn",area:"Permissions",go:()=>go("permissions"),txt:`${t("Tried to sign in outside the allowed places")}: ${oc.map(c=>c.windowsName||c.code||c.id).join(", ")}`});
  if(F.state==="nosupport")out.push({sev:"info",area:"Settings",go:()=>go("settings"),txt:t("Use Chrome or Edge to save to a file.")});
  return out}

   onSave:d=>{const p=readPlace(d.at),x={name:String(d.name).trim(),lat:p.lat,lng:p.lng,r:Math.round(num(d.r))};

/* Computers: every computer that opens a department app (today: AP Sales) writes a "computers" record
   (id = its code) every 5 minutes. A computer works only after it is accepted here (appSettings/sales accepted),
   and stops at once when locked (appSettings/sales locked, by code or letter). */
const ONLINE_MS=7*60*1000;
const compSeen=c=>num(c.seenAt)||num(c.openedAt)||0;
function compState(c){const st=salesSet(),L=c.letter||"";
  if((st.locked||[]).includes(c.id)||(L&&(st.locked||[]).includes(L)))return "locked";
  return (st.accepted||[]).includes(c.id)?"accepted":"waiting"}

  return `<div class="muted small" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px">${chip}${map}</div>`}

      <div class="small">${custLine}<div><span>${T("Total")}</span>: <span class="notr">${fmt(num(b.total))} → ${fmt(num(a.total))}${K}</span></div></div>
      <div class="fixcols small"><div><div class="muted">${T("Now")}</div>${fixLines(b)}</div><div><div class="muted">${T("Asked for")}</div>${fixLines(a)}</div></div>
      ${r?"":`<div class="small bad">${T("Receipt not found")}</div>`}</div>
      <div class="compb">${r?`<button class="btn sm primary" data-fixok="${esc(f.id)}">${T("Approve")}</button>`:""}<button class="btn sm" data-fixno="${esc(f.id)}">${T("Refuse")}</button></div></div>`};
  const outCard=c=>{const o=outTry(c);return `<div class="comp"><div class="compi"><div class="compt">${who(c)} ${o.state==="noplace"?`<span class="chip warn">${T("Place not found")}</span>`:`<span class="chip bad">${T("Outside the allowed places")}</span>`}</div>
      <div class="muted small">${o.user||c.user?`<span class="notr">${esc(o.user||c.user)}</span> · `:""}<span class="notr">${esc(when(o.at))}</span></div>${o.lat!=null?placeLine({placeState:"",place:o,id:c.id}):""}</div></div>`};
  const sec=(title,items,card)=>items.length?`<div class="panel"><h2>${T(title)} · <span class="notr">${items.length}</span></h2><div class="pb"><div class="comps">${items.map(card).join("")}</div></div></div>`:"";
  if(!wc.length&&!fx.length&&!oc.length)return `<div class="panel"><div class="empty"><b>${T("Nothing is waiting for your permission.")}</b></div></div>`;
  return sec("New computers",wc,compCard)+sec("Receipt corrections",fx,fixCard)+sec("Signing in outside the allowed places",oc,outCard)};
V.permissions.bind=()=>{const st=()=>salesSet(),add=(k,v)=>[...new Set((st()[k]||[]).concat([v]))];
  const unwait=id=>{if(DB.computers[id]?.waiting)save("computers",id,Object.assign({},DB.computers[id],{waiting:false}))};
  $$("[data-pacc]").forEach(b=>b.onclick=async()=>{const id=b.dataset.pacc;if(await saveSales({accepted:add("accepted",id)}))unwait(id)});
  $$("[data-pref]").forEach(b=>b.onclick=async()=>{if(!b.classList.contains("arm")){b.classList.add("arm");b.textContent=t("Tap again to refuse");return}
    const id=b.dataset.pref;if(await saveSales({locked:add("locked",id)}))unwait(id)});
  $$("[data-aplace]").forEach(b=>b.onclick=()=>{const c=DB.computers[b.dataset.aplace]||{},p=outTry(c)||c.place||{};editArea(null,{lat:p.lat,lng:p.lng,r:Math.max(200,Math.round(num(p.acc))+100)})});
  $$("[data-fixok]").forEach(b=>b.onclick=async()=>{const id=b.dataset.fixok,f=DB.receiptFixes[id],r=f&&DB.receipts[f.receiptId];if(!f||!r||f.status!=="pending")return;
    if(!(await askPass()))return;const now=Date.now(),before=plainRec(r);
    const nr=Object.assign({},before,plainRec(f.after||{}),{no:r.no,by:r.by||"",createdAt:r.createdAt||now,correctedAt:now,updatedAt:now,
      history:(r.history||[]).concat([{before,reason:f.reason||"",by:f.by||"",at:f.at||now,approvedBy:"main",approvedAt:now}])});
    await save("receipts",f.receiptId,nr);await save("receiptFixes",id,Object.assign({},f,{status:"approved",decidedBy:"main",decidedAt:now,updatedAt:now}),"Approved")});
  $$("[data-fixno]").forEach(b=>b.onclick=()=>{const id=b.dataset.fixno,f=DB.receiptFixes[id];if(!f)return;
    openForm({title:"Refuse the correction",data:{note:""},fields:[{k:"note",label:"Why (the salesperson sees this)",type:"textarea"}],
      check:d=>String(d.note||"").trim().length<2?"Write why":null,
      onSave:async d=>{if(!(await askPass()))return;const now=Date.now();await save("receiptFixes",id,Object.assign({},f,{status:"refused",note:String(d.note).trim(),decidedBy:"main",decidedAt:now,updatedAt:now}),"Refused")}})})};
/* Accounts for the Sales app: made only here (the Sales app reads them from the cloud).
   The password is never kept: hash = PBKDF2-SHA256(password, salt as text), 150000 rounds, 32 bytes, hex.
   office (shown as "Sales manager") = the main office's computer (products, prices, credit limits, letter, cloud key); sales ("Sales person") = makes receipts. */
async function passHash(pw,salt){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  const b=await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:new TextEncoder().encode(salt),iterations:150000},k,256);
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
const ROLES=[["sales","Sales person"],["office","Sales manager"]];
V.accounts=()=>{if(!Cloud.key)return `<div class="panel"><div class="empty"><b>${T("Link the cloud first.")}</b><button class="btn primary" data-go="settings">${T("Settings")}</button></div></div>`;
  const us=rawList("users").sort((a,b)=>(b.active!==false)-(a.active!==false)||String(a.name).localeCompare(String(b.name)));
  const role=r=>T((ROLES.find(x=>x[0]===r)||ROLES[0])[1]);
  return `<div class="bar"><div class="left"></div><div class="left"><button class="btn primary" id="uAdd">${T("New account")}</button></div></div>
   <div class="panel"><h2>${T("Sales app")}</h2><div class="pb">${us.length?`<div class="comps">${us.map(u=>`<div class="comp"><div class="compi">
     <div class="compt"><b class="notr">${esc(u.name||u.username)}</b> ${u.active===false?`<span class="chip mute">${T("Turned off")}</span>`:`<span class="chip ${u.role==="office"?"warn":"good"}">${role(u.role)}</span>`}</div>
     <div class="muted small"><span>${T("Username")}</span> <span class="notr">${esc(u.username)}</span> · <span>${T("Record code")}</span> <b class="notr">${esc(okAccCode(u.letter)?u.letter:"—")}</b></div></div>
     <div class="compb"><button class="btn sm" data-uedit="${esc(u.id)}">${T("Edit")}</button></div></div>`).join("")}</div>`
     :`<div class="empty"><b>${T("No accounts yet")}</b><button class="btn primary" id="uAdd2">${T("New account")}</button></div>`}</div></div>`};
/* Each account gets its own record code automatically when it is made (the owner, 2026-11-23): S1, S2, … for a
   Sales person, A1, A2, … for a Sales manager. Nobody chooses it and it never changes, so numbers never clash:
   that person's receipts, payments, returns, orders and quotations are S1-000001, S1-P000001, … (kept in users.letter,
   which the Sales app reads). Which computer made a record is kept in the record itself (pc, written by the Sales app). */
const okAccCode=c=>/^[AS][1-9]\d*$/.test(String(c||""));
function nextAccCode(role,skipId){const P=role==="office"?"A":"S";
  const n=rawList("users").filter(x=>x.id!==skipId).map(x=>String(x.letter||"")).filter(c=>c[0]===P&&okAccCode(c)).reduce((a,c)=>Math.max(a,+c.slice(1)),0);
  return P+(n+1)}
function editAccount(id){const u=id?DB.users[id]:{role:"sales",active:true},has=okAccCode(u.letter);
  const codeBox=()=>`<div class="field"><label>${T("Record code (given automatically)")}</label><div class="muted"><b class="notr" id="accCode">${esc(has?u.letter:nextAccCode($("#f_role")?$("#f_role").value:u.role||"sales",id))}</b></div></div>`;
  openForm({title:id?(u.name||u.username):"New account",data:{name:u.name||"",username:u.username||"",role:u.role||"sales",active:u.active===false?"":"1",pw:"",pw2:""},fields:[
    {k:"name",label:"Name (goes on receipts)",half:1},{k:"username",label:"Username",half:1},
    {k:"role",label:"Kind",type:"select",opts:ROLES.map(([k,l])=>[k,t(l)]),half:1},{k:"active",label:"Can sign in?",type:"select",opts:[["1",t("Yes")],["",t("No, turn off")]],half:1},
    {k:"pw",label:id?"New password (leave empty to keep)":"Password",type:"password",half:1,after:1},{k:"pw2",label:"Password again",type:"password",half:1,after:1}],
   extra:codeBox,bind:()=>{if(!has)$("#f_role").onchange=()=>{$("#accCode").textContent=nextAccCode($("#f_role").value,id)}},
   collect:d=>{d.name=String(d.name||"").trim();d.username=String(d.username||"").trim().toLowerCase();d.letter=has?u.letter:nextAccCode(d.role,id)},
   check:d=>!d.name?"Enter a name":!/^[a-z0-9._-]{2,30}$/.test(d.username)?"Username: small letters and numbers only":
     rawList("users").some(x=>x.username===d.username&&x.id!==id)?"This username is taken":
     (!id&&!d.pw)?"Enter a password":(d.pw&&d.pw.length<6)?"Password: at least 6 characters":d.pw!==d.pw2?"The two passwords are not the same":null,
   onSave:async d=>{if(!(await askPass()))return;const now=Date.now(),rec=Object.assign({},u,{name:d.name,username:d.username,letter:d.letter,role:d.role,active:!!d.active,updatedBy:"main",updatedAt:now});
     if(!id){rec.createdBy="main";rec.createdAt=now}
     if(d.pw){rec.salt=[...crypto.getRandomValues(new Uint8Array(16))].map(x=>x.toString(16).padStart(2,"0")).join("");rec.hash=await passHash(d.pw,rec.salt)}
     save("users",id||uid("u"),rec,"Saved")}})}
V.accounts.bind=()=>{["#uAdd","#uAdd2"].forEach(k=>$(k)&&($(k).onclick=()=>editAccount(null)));$$("[data-uedit]").forEach(b=>b.onclick=()=>editAccount(b.dataset.uedit))};
// the page refreshes itself every minute so "open now" stays true
setInterval(()=>{if(UI.page==="computers"&&!form)render()},60000);
async function saveSales(ch){if(!(await askPass()))return false;await save("appSettings","sales",Object.assign({},salesSet(),ch),"Saved");return true}
V.settings.bind=()=>{bindLang();
  passGet().then(pc=>{const c=$("#passNow"),b=$("#passCh");if(!c)return;c.className="chip "+(pc?"good":"warn");c.textContent=t(pc?"On":"Not set");b.textContent=t(pc?"Change passcode":"Set a passcode");
    b.onclick=async()=>{if(pc&&!(await askPass(true)))return;if(await passBox("new"))render()}});
  $$("[data-st]").forEach(b=>b.onclick=()=>{const st=salesSet(),all=SALES_TABS.map(x=>x[0]);let on=st.tabs&&st.tabs.length?st.tabs:all;const k=b.dataset.st;
    on=on.includes(k)?on.filter(x=>x!==k):all.filter(x=>x===k||on.includes(x));if(!on.length)return toast(t("Keep at least one tab"));saveSales({tabs:on})});
  $$("[data-area]").forEach(b=>b.onclick=()=>editArea(b.dataset.area==="new"?null:+b.dataset.area));
  // tax % for new receipts, orders and quotations in the Sales app (appSettings/sales taxPct; 0 = no tax)
  const tx=$("#taxEd");if(tx)tx.onclick=()=>openForm({title:"Tax",data:{taxPct:salesSet().taxPct||""},fields:[{k:"taxPct",label:"Tax % (0 = no tax)",type:"num"}],
    check:d=>{const v=num(d.taxPct);return v<0||v>100?"Between 0 and 100":null},onSave:d=>saveSales({taxPct:Math.round(num(d.taxPct)*100)/100})});

  const l=$("#cLink");if(l)l.onclick=async()=>{const k=$("#cKey").value;if(!k.trim())return;if(!(await askPass()))return;l.disabled=true;if(await Cloud.link(k))toast(t("Linked to the cloud"));render()};
  const u=$("#cUnlink");if(u)u.onclick=async()=>{if(!u.classList.contains("arm")){u.classList.add("arm");u.textContent=t("Tap again to unlink");return}if(!(await askPass()))return render();await Cloud.unlink();render()}};

/* ================= page frame ================= */
/* departments, each with its own tabs. UI.page is the tab (or the page, when a department has no tabs). */
const DEPTS=[
  {id:"overview",name:"Overview"},
  {id:"permissions",name:"Permissions"},
  {id:"sales",name:"Sales",tabs:[["receipts","Receipts"],["payments","Payments"],["orders","Orders"],["customers","Customers"]]},
  {id:"production",name:"Production",tabs:[["raw","Raw materials"],["finished","Finished products"],["waste","Waste products"]]},
  {id:"computers",name:"Computers",tabs:[["computers","Computers"],["accounts","Accounts"]]},
  {id:"settings",name:"Settings"}];
const OLD={products:"finished"};   // older page names still used in a few places
const deptOf=k=>DEPTS.find(d=>d.id===k||(d.tabs||[]).some(x=>x[0]===k))||DEPTS[0];
/* Every tab is built the same way, top to bottom:
   1. tools: month (and search) on the left, buttons on the right, the main button last and outlined in blue
   2. four numbers (kpiRow)   3. graphs (chartSet)   4. the lists, each in a panel with a title */
function kpi(l,v,d,cls=""){return `<div class="kpi"><span class="l">${T(l)}</span><span class="v notr ${cls}">${v}</span><span class="d">${d||"&nbsp;"}</span></div>`}
const kpiRow=items=>`<div class="kpis">${items.join("")}</div>`;
const count=(n,one,many)=>`<span class="notr">${fmt(n)}</span> ${T(n===1?one:many)}`;
const listTitle=(l,m)=>`<h2>${T(l)}${m?` · <span class="notr">${esc(monthName(m))}</span>`:""}</h2>`;
function empty(title,body,btn,id){return `<div class="panel"><div class="empty"><b>${T(title)}</b>${body?`<div>${T(body)}</div>`:""}${btn?`<button class="btn primary" id="${id}">${T(btn)}</button>`:""}</div></div>`}
function monthPicker(){return `<span class="seg"><button id="mPrev" aria-label="Previous month">‹</button><button aria-pressed="false" style="cursor:default" class="notr">${esc(monthName(UI.month))}</button><button id="mNext" aria-label="Next month">›</button></span>`}
function bindMonth(){$("#mPrev")&&($("#mPrev").onclick=()=>{UI.month=addMonth(UI.month,-1);render()});$("#mNext")&&($("#mNext").onclick=()=>{UI.month=addMonth(UI.month,1);render()})}
function bindSearch(){const q=$("#q");if(!q)return;q.oninput=()=>{UI.q=q.value;const pos=q.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(pos,pos)}}
const langSeg=()=>`<span class="seg"><button data-lang="my" aria-pressed="${UI.lang==="my"}">မြန်မာ</button><button data-lang="en" aria-pressed="${UI.lang==="en"}">English</button></span>`;
function bindLang(){$$("[data-lang]").forEach(b=>b.onclick=()=>{UI.lang=b.dataset.lang;ls("ap2.lang",UI.lang);render()})}
function go(p,exact){p=OLD[p]||p;const d=deptOf(p);if(!exact&&d.id===p&&d.tabs)p=ls("ap2.tab."+d.id)||d.tabs[0][0];if(d.tabs)ls("ap2.tab."+d.id,p);UI.page=p;UI.q="";ls("ap2.page",p);render();window.scrollTo(0,0)}
function fileBanner(){const F=Store.file;if(!Store.ready)return "";
  if(F.state==="need")return `<div class="banner"><span>${T("Records file is closed")}</span><button class="btn sm primary" data-file="open">${T("Open")}</button></div>`;
  if(F.state==="on"&&F.err)return `<div class="banner bad"><span>${T("Could not save to the records file")}</span><button class="btn sm" data-file="pick">${T("Choose folder")}</button></div>`;
  return ""}
function syncText(){const r=fileSyncText();if(!Store.ready||!Cloud.key)return r;
  if(Cloud.state==="badkey")return ["bad",t("Cloud: wrong key")];
  if(Cloud.state==="offline")return [r[0]==="bad"?"bad":"",r[1]+" · "+t("cloud waiting")];
  return [r[0],r[1]+(Object.keys(Cloud.q).length?" · "+t("sending"):" · "+t("cloud"))]}
function fileSyncText(){const F=Store.file;if(!Store.ready)return ["",t("Loading…")];
  if(F.state==="on")return F.err?["bad",t("Not saved")]:["on",t("Saved")];
  if(F.state==="need")return ["",t("Records file is closed")];return ["",t("Saved")]}
function render(){
  const tp=document.getElementById("tip");if(tp)tp.style.display="none";
  document.documentElement.lang=UI.lang==="my"?"my":"en";
  const dept=deptOf(UI.page);let id=UI.page;if(!V[id])id=dept.tabs?dept.tabs[0][0]:dept.id;const name=dept.name;
  const nAl=Store.ready?alerts().filter(a=>a.sev!=="info").length:0;
  const nPm=Store.ready?permCount():0;
  const navBtn=d=>`<button data-go="${d.id}" aria-current="${d.id===dept.id}">${svg(d.id)}<span>${T(d.name)}</span>${d.id==="overview"&&nAl?`<span class="count notr">${nAl}</span>`:""}${d.id==="permissions"&&nPm?`<span class="count notr">${nPm}</span>`:""}</button>`;
  $("#nav").innerHTML=DEPTS.map(navBtn).join("");$("#bnav").innerHTML=DEPTS.map(navBtn).join("");
  $$("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  $$("[data-t]").forEach(el=>{el.__en=el.__en||el.textContent;el.textContent=t(el.__en)});
  const [cls,txt]=syncText();$("#dot").className="dot "+cls;$("#sync").textContent=txt;
  if(Store.ready)PAID=paidMap();
  const body=Store.ready?V[id]():`<div class="empty">${T("Loading…")}</div>`;
  const tabs=dept.tabs?`<div class="tabs" role="tablist">${dept.tabs.map(([k,n])=>`<button role="tab" data-go="${k}" data-exact="1" aria-selected="${k===id}">${T(n)}</button>`).join("")}</div>`:"";
  $("#main").innerHTML=`<div class="top"><div><h1>${T(name)}</h1></div><div class="tools">${id!=="settings"?langSeg():""}</div></div>${tabs}${fileBanner()}${body}`;
  bindLang();
  if(Store.ready&&V[id].bind)V[id].bind();
  $$("#main [data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go,!!b.dataset.exact));
  $$("[data-file]").forEach(b=>b.onclick=()=>fileAction(b.dataset.file==="pick"?"pick":b.dataset.file));
  if(!Store.canChange())$$("#main .btn.primary:not([data-file])").forEach(b=>b.disabled=true);
}

/* ================= start ================= */
render();
Store.start().then(()=>Cloud.load()).then(moveOldProducts).then(render).catch(e=>{$("#main").innerHTML=`<div class="banner bad">${esc(String(e&&e.message||e))}</div>`});
</script>
